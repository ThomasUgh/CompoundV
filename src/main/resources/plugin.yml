name: CompoundV
version: 1.1.2
main: de.thomasugh.compoundv.CompoundV
api-version: '1.20'
folia-supported: true
author: Thomas U.
description: CompoundV - modular ability serums for Minecraft
website: https://github.com/thomasugh/compoundv

commands:
  compoundv:
    description: CompoundV main command
    aliases: [cv]
    usage: /cv <give|remove|info|stats|tutorial|reload|help>

permissions:
  compoundv.use:
    description: Allows drinking CompoundV potions and using abilities
    default: true

  compoundv.admin:
    description: Allows all CompoundV admin commands and bypass actions
    default: op
    children:
      compoundv.command.give: true
      compoundv.command.remove: true
      compoundv.command.reload: true
      compoundv.command.info.others: true
      compoundv.command.stats.others: true
      compoundv.damage-bypass: true

  compoundv.command.help:
    description: Allows /cv help
    default: true
  compoundv.command.info:
    description: Allows /cv info for yourself
    default: true
  compoundv.command.stats:
    description: Allows /cv stats for yourself
    default: true
  compoundv.command.tutorial:
    description: Allows /cv tutorial
    default: true
  compoundv.command.give:
    description: Allows /cv give
    default: op
  compoundv.command.remove:
    description: Allows /cv remove
    default: op
  compoundv.command.reload:
    description: Allows /cv reload
    default: op
  compoundv.command.info.others:
    description: Allows /cv info <player>
    default: op
  compoundv.command.stats.others:
    description: Allows /cv stats <player>
    default: op

  compoundv.damage-bypass:
    description: Allows trusted admins to bypass protected/immortal target damage fallback
    default: op
