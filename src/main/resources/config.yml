# CompoundV 1.1.3 configuration
# Keep this file small. Values not listed here use safe built-in defaults.

# Internal config schema version. Do NOT edit by hand. CompoundV uses this to
# apply one-time upgrades. Your custom values are preserved across restarts.
config-version: 5

# ─────────────────────────────────────────────────────────────────────────────
# General
# ─────────────────────────────────────────────────────────────────────────────
# Available languages: en, de, es, fr, hi, ru, zh, tr
# available: en, de, es, fr, hi, ru, zh, tr, fi
language: en

updates:
  # Checks Modrinth for a newer CompoundV version on startup.
  enabled: true
  # Print update notices to the server console.
  console: true
  # Show update notices to OP players when they join.
  op_chat: true
  # Delay the OP join notice so it appears after most join messages. 60 ticks = 3 seconds.
  op_chat_delay_ticks: 60


# ─────────────────────────────────────────────────────────────────────────────
# Potion roll chances
# ─────────────────────────────────────────────────────────────────────────────
# These are weighted chances, not strict percentages. Higher value = more common.
compound_v:
  chances:
    the_patriot: 1
    bloodweaver: 2
    fly: 15
    heat_vision: 9
    heat_vision_2: 7
    heat_vision_3: 6
    heat_vision_4: 5
    ice_cube: 8
    speedster: 10
    strength: 18
    the_ghost: 7
    fire: 20
    the_diver: 7
    the_runner: 4
    jumper: 17
    shockwave: 9
    vision: 7
    teleporter: 3
    size_changer: 6
    the_worm: 15
    flash_light: 5
    fire_sonic: 4
    toxic_cloud: 9
    the_countess: 6
    the_warrior: 3
    the_headpopper: 2
    spider_weaver: 8
    the_detonator: 6

temp_v:
  # Temp V uses minutes. Re-drinking Temp V can extend the same temporary power.
  min_duration_minutes: 15
  max_duration_minutes: 120
  chances:
    fly: 10
    heat_vision: 9
    heat_vision_2: 7
    heat_vision_3: 6
    heat_vision_4: 5
    speedster: 20
    strength: 25
    the_ghost: 15
    fire: 10

v_one:
  # V One can roll V-One-only powers. Upgrade powers still require an existing CV power.
  drink_effect_seconds: 5
  chances:
    the_veteran: 3
    sonic_boom: 3
    stormstrike: 4
    heal_angel: 6
    submarine: 4

# ─────────────────────────────────────────────────────────────────────────────
# Core combat tuning
# ─────────────────────────────────────────────────────────────────────────────
combat:
  custom_kill_messages:
    # Uses language files for The-Boys-like ability death messages.
    enabled: true
  protection_bypass:
    # Optional direct-damage fallback for protected/immortal targets.
    # Keep disabled unless trusted admins should bypass protection plugins.
    enabled: false
    # true = every ability can use the fallback when the caster has the permission.
    # false = only abilities that explicitly allow the fallback can use it.
    apply_to_all_ability_damage: true
    permission: compoundv.damage-bypass

heat_vision:
  # Entity raytrace hit radius in blocks. 0.05 is the old/default thin beam.
  hit_radius: 0.051
  damage_interval: 2
  # Folia/performance: how often (in ticks) the cosmetic along-beam block effects
  # (snow melt, water sizzle, vegetation clearing) are scanned. Higher = cheaper.
  # Damage and raytrace are NOT affected by this; only visual block effects.
  block_effect_interval_ticks: 4
  active_sound:
    enabled: true
    repeat_interval_ticks: 2
    sound: entity.blaze.shoot
    volume: 0.05
    pitch: 0.75
  # Player damage sounds stay disabled by default. Mob/animal hurt sounds use the old Heatvision behavior.
  player_damage_sound:
    enabled: false
  generic_hit_sound:
    enabled: true
  # Master particle settings for all Heatvision beams: stage I-IV and The Patriot/V One.
  particles:
    # Folia/performance: render the visible beam strand every N ticks instead of
    # every tick. 1 = old behavior (most particles), 2 = half the packets, etc.
    render_interval_ticks: 2
    core_particles: 2
    glow_particles: 1
    impact_particles: 12
    core_size: 0.55
    glow_size: 0.35
    step: 0.40
  stages:
    stage_1:
      damage_hearts: 1.35
      range: 30.0
      core_particles: 2
    stage_2:
      damage_hearts: 2.0
      range: 35.0
      core_particles: 2
      active_sound: { pitch: 0.90 }
    stage_3:
      damage_hearts: 2.25
      range: 37.0
      core_particles: 2
      active_sound: { pitch: 1.05 }
    stage_4:
      damage_hearts: 2.7
      range: 40.0
      core_particles: 2
      impact_particles: 16
      active_sound: { pitch: 1.20 }

abilities:
  # The Patriot: shared flight/landing tuning + higher-pitched Heatvision sound.
  the_patriot:
    shared:
      launch_velocity: 3.85
      heat_vision_active_sound:
        enabled: true
        repeat_interval_ticks: 2
        sound: entity.wither.shoot
        volume: 0.05
        pitch: 1.8
      # Bukkit/Spigot cannot detect the real Pick-Block middle-click reliably.
      # This uses Sneak + hotbar scroll as vanilla-server compatible dash trigger.
      speed_dash:
        enabled: true
        require_sneak: true
        range: 25.0
        cooldown_ms: 5000
        damage:
          enabled: true
          min_hearts: 1.0
          max_hearts: 2.0
          radius: 2.20
          path_step: 0.45
          max_targets: 8
        sound:
          enabled: true
          sound: entity.ender_dragon.flap
          volume: 1.35
          pitch: 1.30
          repeat_at_destination: true
      launch_flap_sound:
        sound: entity.ender_dragon.flap
        volume: 1.10
        pitch: 1.35
    compound_v:
      resistance_level: 3
      heat_vision_range: 44.0
      heat_vision_damage_hearts: 4.5
      heat_vision_damage_multiplier: 1.0
      heat_vision_hit_radius: 0.0525
      heat_vision_core_particles: 2
      heat_vision_impact_particles: 17
    v_one:
      resistance_level: 4
      heat_vision_range: 50.0
      heat_vision_damage_hearts: 4.725
      heat_vision_damage_multiplier: 1.0
      heat_vision_hit_radius: 0.0525
      heat_vision_core_particles: 2
      heat_vision_impact_particles: 19
      heat_vision_active_sound:
        volume: 0.06
        pitch: 1.99

  # Bloodweaver: Marie-Moreau-like blood control. F = Blood Lash, Sneak + Left-Click = charged Blood Rupture.
  bloodweaver:
    shared:
      heat_vision_received_damage_multiplier: 0.5
      lash:
        range: 25.0
        hit_radius: 0.75
        cooldown_ms: 3000
        slowness_ticks: 60
        slowness_level: 2
        bleed_ticks: 60
        bleed_interval_ticks: 20
        bleed_damage_hearts: 0.5
      melee_bleed:
        required_hits: 3
        duration_ticks: 40
        interval_ticks: 20
        damage_hearts: 0.5
      rupture:
        radius: 15.0
        charge_ticks: 60
        cooldown_ms: 45000
        self_cost_hearts: 2.0
        self_weakness_ticks: 400
        self_weakness_level: 1
        tick_period: 4
        particle_interval_ticks: 10
        damage_interval_ticks: 20
        damage_hearts_per_second: 2.0
    compound_v:
      resistance_level: 3
      strength_level: 2
      regen_level: 2
      extra_hearts: 5.0
      lash:
        min_damage_hearts: 2.0
        max_damage_hearts: 4.0
      rupture:
        duration_ticks: 100
    v_one:
      resistance_level: 3
      strength_level: 2
      regen_level: 2
      extra_hearts: 10.0
      lash:
        min_damage_hearts: 2.5
        max_damage_hearts: 5.0
      rupture:
        duration_ticks: 140

  # Stormstrike: F = beam, Sneak + Left-Click = 2 lightning strikes.
  stormstrike:
    beam_damage_hearts: 0.95625
    beam_hit_radius: 6.5         # Damage radius around the visible beam particles
    lightning_tick_damage_hearts: 0.54
    lightning_hit_radius: 7.0
    lightning_cooldown_ms: 7000
    lightning_min_bolts: 2
    lightning_max_bolts: 2

  # IceCube: Frost Walker, slippery movement and F ice spikes.
  ice_cube:
    frost_walker_radius: 2
    frosted_ice_keep_ms: 4500
    spike_cooldown_ms: 3000
    spike_velocity: 2.15
    spike_damage_hearts: 0.0
    spike_slowness_ticks: 100
    spike_slowness_level: 3
    spike_weakness_ticks: 200
    spike_weakness_level: 2
    melee_slowness_ticks: 100
    melee_slowness_level: 1
    wall_cooldown_ms: 60000
    wall_duration_ticks: 500
    wall_distance: 4.0
    wall_width: 5
    wall_height: 3
    slide:
      enabled: true
      multiplier: 1.045
      max_horizontal_speed: 0.64
      sneak_brakes: true

  # FireSonic is intentionally weaker than Heat Vision but ticks at a similar speed.
  fire_sonic:
    beam_damage_hearts: 0.75
    beam_fire_ticks: 70
    melee_fire_ticks: 80

  # SizeChanger keeps the size fantasy, but transformation damage is heavily reduced.
  size_changer:
    strength_level: 1
    resistance_level: 1
    big_damage_multiplier: 1.25
    big_extra_hearts: 0.0
    big_jump_boost_level: 0
  size_changer_v_one:
    strength_level: 1
    resistance_level: 1
    big_damage_multiplier: 1.75
    big_extra_hearts: 0.0
    big_jump_boost_level: 0

  # The Patriot + V One: short ascension animation (look up + heat-vision beam upward).
  the_patriot_v_one:
    ascension_cinematic:
      enabled: true
      start_delay_ticks: 45
      charge_up_ticks: 40
      # 80 ticks = 4s beam, player is locked this whole time
      beam_duration_ticks: 80
      # beam length in blocks (~100-120)
      beam_height: 110


  # The Runner: speed stages. Level 20 is the final high-speed stage with extra impact damage.
  the_runner:
    resistance_level: 1
    strength_level: 2
    extra_hearts: 5.0
    attack_speed_bonus: 1024.0
    speed_levels: [11, 12, 15, 20]
    default_speed_level: 11
    impact_min_speed_level: 11
    impact_base_damage_hearts: 6.0
    impact_damage_per_speed_level_hearts: 1.0
    impact_level_20_bonus_hearts: 3.0
    impact_radius: 0.65
    impact_vertical_radius: 0.55
    impact_min_move_delta: 0.08
    impact_min_horizontal_speed: 0.32
    impact_path_step: 0.28
    impact_cooldown_ms: 750
    impact_knockback: 1.15

  # The Veteran: Sneak + Left-Click charges a heavy chest blast.
  # Lower defaults avoid public-server ping spikes. Use /compoundv reload after config changes.
  the_veteran:
    resistance_level: 4
    strength_level: 5
    extra_hearts: 20.0
    charge_duration_ticks: 100
    burst_cooldown_ms: 300000

    ground_zero:
      enabled: true
      radius: 12.0
      damage_hearts: 5.0
      scale_damage_by_distance: false
      player_damage_multiplier: 1.0
      entity_damage_multiplier: 1.0
      max_targets: 32
      particles_enabled: true
      particle_multiplier: 0.16
      sounds_enabled: true
      set_fire: false

    chest_beam:
      enabled: true
      duration_ticks: 70
      tick_period: 6
      range: 46.0
      # Beam thickness (blocks). Affects both the visual strand spread and the
      # carve/hit width. Raised from 1.20 for a chunkier Soldier-Boy beam.
      radius: 1.6
      damage_hearts_per_tick: 1.0
      damage_interval_ticks: 6
      player_damage_enabled: true
      player_damage_multiplier: 1.0
      entity_damage_multiplier: 1.0
      particles_enabled: true
      particle_interval_ticks: 12
      particle_step: 1.55
      particle_multiplier: 0.18
      particle_start_distance: 0.7
      hit_particles: 1
      entity_scan_interval_ticks: 12
      max_entity_hits_per_pulse: 4
      sounds_enabled: true
      block_damage:
        enabled: true
        ignite_blocks: false
        # interval_ticks MUST be a multiple of tick_period (6) or pulses won't
        # align. 6 = break on every beam pulse for strong, consistent carving.
        interval_ticks: 6
        max_blocks_per_pulse: 8
        hits_to_break: 1
        # Scales the per-pulse block-break budget (8 * 0.75 = 6 blocks/pulse).
        # Does NOT affect entity/player damage (those are separate multipliers).
        multiplier: 0.75
        # surface_only true keeps it from hollowing huge volumes (lag-safe);
        # it still eats through walls layer by layer.
        surface_only: true
        block_step: 1.0
        block_particles: 1

    mushroom_cloud:
      enabled: true
      delay_after_beam_ticks: 30
      duration_ticks: 160
      period_ticks: 40
      height: 13.0
      radius: 6.0
      particle_multiplier: 0.10
      sound_duration_ticks: 0

  # The Diver: F uses Riptide Dash. Sneak + Left-Click toggles Sonar.
  the_diver:
    sonar_radius: 45.0
    riptide_velocity: 3.85
    riptide_cooldown_ms: 1800

  # Submarine: F uses the stronger dash. Sneak + Left-Click toggles Sonar.
  submarine:
    sonar_radius: 65.0
    riptide_velocity: 10.0
    riptide_cooldown_ms: 1000

  # The Detonator: the countdown starts with Sneak + Left-Click, including air clicks.
  the_detonator:
    explosion_charge_ticks: 60
    explosion_cooldown_ms: 10000
    cancel_charge_when_sneak_released: false

  # The Headpopper (Victoria Neuman): Sneak + Left-Click marks the entity you are
  # looking at, then pops it after a countdown. Toggling the ability releases an
  # area pulse around you. These settings were previously only built-in defaults;
  # they are now exposed here so they can be tuned.
  the_headpopper:
    # Permanent buffs while the ability is held (level, 1 = effect tier I).
    strength_level: 2
    resistance_level: 2
    regeneration_level: 1
    # Single-target mark: how far you can mark, countdown length, and the pop.
    range: 30.0
    countdown_seconds: 3
    slowness_amplifier: 2
    damage_hearts: 12.5
    mob_damage_multiplier: 2.5
    cooldown_ms: 20000
    # Area pulse (on toggle): radius and % of each target's current health dealt.
    area_radius: 10.0
    area_damage_health_percent: 0.25
    area_cooldown_ms: 120000

# ─────────────────────────────────────────────────────────────────────────────
# Crafting / V-Null / Side effects
# ─────────────────────────────────────────────────────────────────────────────
brewing:
  # Custom brewing simulation fallback. Workbench recipes are the main supported lab path.
  require_blaze_powder: false
  custom_brew_time_ticks: 400

v_null:
  # V-Null removes/suppresses powers. Splash and lingering variants use custom radius logic.
  standard:
    effect_seconds: 900
  v_one:
    min_seconds: 60
    max_seconds: 120
    slowness_seconds: 30
  splash:
    radius: 4.0
  lingering:
    radius: 4.0
    duration_ticks: 160
  unpowered:
    effect_seconds: 0
  mobs:
    effect_seconds: 0

side_effects:
  enabled: true
  # small extra side effects with low chance (percent) on Compound V / V One
  minor_flavor:
    enabled: true
    nosebleed:
      chance: 2.5
    static_discharge:
      chance: 2.0
    dizziness:
      chance: 3.0
    adrenaline_rush:
      chance: 2.0
  temp_v:
    # Small crash effects applied when Temp V expires. Durations are in seconds.
    expiry_aftereffects:
      enabled: true
      chance: 100.0
      min_seconds: 30
      max_seconds: 180
      min_effects: 1
      max_effects: 3
      effects:
        nausea:
          chance: 35.0
          amplifier: 0
        blindness:
          chance: 18.0
          amplifier: 0
        slowness:
          chance: 30.0
          amplifier: 0
        weakness:
          chance: 25.0
          amplifier: 0
        mining_fatigue:
          chance: 18.0
          amplifier: 0
        hunger:
          chance: 20.0
          amplifier: 0
