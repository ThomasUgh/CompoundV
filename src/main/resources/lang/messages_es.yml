language_file_version: 28
prefix: '&8[&b&lCV&r&8] '
general:
  no_permission: <prefix>&cNo tienes permiso para hacer esto.
  player_not_found: <prefix>&cJugador no encontrado.
  reloaded: <prefix>&aCompoundV se ha recargado.
  not_a_player: <prefix>&cEste comando solo puede ser usado por jugadores.
  only_players: <prefix>&cEste comando solo puede ser usado por jugadores.
potion:
  drinking: <prefix>&7El &bsuero&7 se está activando...
  drink_temp_v: <prefix>&aTemp V&7 se está activando. Tu habilidad durará solo un tiempo limitado.
  drink_v_one: <prefix>&3V One&7 se está activando. Prepárate.
  drink_anti_v: <prefix>&cAnti V&7 está eliminando tu habilidad activa.
  no_ability: <prefix>&7No tienes una habilidad activa.
  no_chances: <prefix>&cEsta poción no tiene habilidades válidas configuradas. Contacta con un admin.
  roll_failed: <prefix>&cNo se pudo procesar el suero. Contacta con un admin.
  drink_v_null: <prefix>&2V-Null Virus&7 se está propagando...
  temp_v_extended: <prefix>&aTemp V&7 se ha extendido. Misma habilidad, mayor duración.
  compound_v_after_temp: <prefix>&bCompound V&7 se vinculó con tu habilidad temporal. Una habilidad permanente de Compound V se activará cuando expire Temp V.
  compound_v_delayed_granted: <prefix>&bCompound V&7 ahora se ha activado permanentemente.
  temp_v_blocked_by_compound: <prefix>&aTemp V&7 no puede sobrescribir Compound V permanente. Solo ocurrieron efectos secundarios menores.
  no_effect_compound_active: <prefix>&7Compound V no tiene efecto si ya tienes una habilidad permanente. Usa &cAnti V&7 primero.
  no_effect_v_one_active: <prefix>&7Tu sistema V One rechaza más V. No pasa nada.
  v_one_upgrade: <prefix>&3V One&7 mejoró tu poder actual.
  v_one_no_upgrade: <prefix>&7V One aún no reaccionó con esta habilidad.
  only_drinkable: <prefix>&cLos sueros Compound V solo pueden usarse como pociones bebibles normales. V-Null Virus es arrojadizo.
  milk_blocked: <prefix>&cMilk cannot remove Compound V powers. Use Anti V or V-Null mechanics instead.
ability:
  granted_header: <prefix>&8━━━━━━━━ &aHabilidad desbloqueada &8━━━━━━━━
  granted_name: <prefix>&7Has desbloqueado &a&l{name}&r&7 mediante &b{potion}&7.
  controls_header: <prefix>&8────── &aControles y efectos &8──────
  granted_expires: '<prefix>&8• &7Duración: &e{minutes}m {seconds}s'
  granted_footer: <prefix>&8━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  lost_on_death: <prefix>&cPerdiste tu habilidad al morir.
  expired: <prefix>&eTu habilidad temporal ha expirado.
  removed_admin: <prefix>&cUn admin eliminó tu habilidad.
  removed_anti_v: <prefix>&cAnti V eliminó tu habilidad.
  the_patriot:
    description:
    - '<prefix>&8• &7Estilo: como &cHomelander&7.'
    - <prefix>&8• &aVuelo&7 está activado automáticamente.
    - '<prefix>&8• &cVisión Calorífica&7: pulsa &dF &8(Swap Item with Offhand)&7 para alternar. Predeterminado: &e5 corazones&7, &e44 bloques&7.'
    - '<prefix>&8• &bRayos X&7: &dAgacharse + clic izquierdo al aire&7 para revelar entidades cercanas.'
    - '<prefix>&8• &6Inicio de salto&7: &dAgacharse&7, mira hacia arriba y salta para lanzarte.'
    - '<prefix>&8• &7Mejoras pasivas: &aFuerza&7, &9Resistencia&7, &dRegeneración&7 y &ccorazones extra&7.'
  the_patriot_v_one:
    description:
    - '<prefix>&8• &7Estilo: como &cHomelander&7.'
    - <prefix>&8• &aVuelo&7 está activado automáticamente con mejoras V One más fuertes.
    - '<prefix>&8• &cVisión Calorífica&7: pulsa &dF &8(Swap Item with Offhand)&7 para alternar. Predeterminado: &e4.725 corazones&7, &e50 bloques&7.'
    - '<prefix>&8• &bRayos X&7: &dAgacharse + clic izquierdo al aire&7 para revelar entidades cercanas.'
    - '<prefix>&8• &6Inicio de salto&7: &dAgacharse&7, mira hacia arriba y salta para lanzarte.'
    - '<prefix>&8• &7Mejoras pasivas: &aFuerza&7, &9Resistencia&7, &dRegeneración&7, &6Resistencia al fuego&7 y &ccorazones extra&7.'
  sonic_boom:
    description:
    - '<prefix>&8• &7Estilo: como &3Bombsight&7.'
    - <prefix>&8• &aVuelo&7 está activado automáticamente.
    - '<prefix>&8• &6Inicio de salto&7: &dAgacharse&7, mira hacia arriba y salta. Stronger than Vuelo, slightly weaker than Patriot.'
    - '<prefix>&8• &3Rayo sónico&7: &dAgacharse + clic izquierdo&7 para disparar a rayo sónico estilo Warden. Enfriamiento: &e3s&7.'
    - '<prefix>&8• &cMelee explosivo&7: cada 2nd golpe adds a small blast; crits golpe harder.'
    - '<prefix>&8• &cAterrizaje explosivo&7: &dAgacharse&7 when landing después de a high fall. Enfriamiento: &e60s&7.'
    - '<prefix>&8• &7Mejoras pasivas: &aFuerza IV&7 y &9Resistencia IV&7.'
  size_changer:
    description:
    - '<prefix>&8• &7Mejoras pasivas: &aFuerza II&7 y &9Resistencia II&7.'
    - '<prefix>&8• &dAgacharse + clic izquierdo + mira hacia arriba&7: volverse &52x más grande&7, daño doble, &aJump Boost II&7 y &c+10 corazones&7 for max &e1min&7.'
    - '<prefix>&8• &dAgacharse + clic izquierdo + mira hacia abajo&7: volverse &53.5x más pequeño&7 for max &e2min&7.'
    - <prefix>&8• &7While transformed, &dAgacharse + clic izquierdo + mira hacia arriba/down&7 returns you to normal instantly.
    - <prefix>&8• &7El cooldown empieza después de volver a la normalidad.
  size_changer_v_one:
    description:
    - '<prefix>&8• &3V One Upgrade&7 for SizeChanger. Passive: &aFuerza III&7 y &9Resistencia II&7.'
    - '<prefix>&8• &dAgacharse + clic izquierdo + mira hacia arriba&7: aprox. &53x más grande&7, más daño, &aJump Boost IV&7 y &c+20 corazones&7.'
    - '<prefix>&8• &dAgacharse + clic izquierdo + mira hacia abajo&7: aprox. &57x más pequeño&7.'
    - <prefix>&8• &7Solo se obtiene al mejorar un SizeChanger activo con &3V One&7.
  heat_vision:
    description:
    - '<prefix>&8• &bVisión Calorífica&7: pulsa &dF &8(Swap Item with Offhand)&7 para alternar the beam.'
    - '<prefix>&8• &7Stages: &bI&7 = 1.35 corazones / 30 bloques, &aII&7 = 2 corazones / 35 bloques.'
    - '<prefix>&8• &7More stages: &6III&7 = 2.25 corazones / 37 bloques, &cIV&7 = 2.7 corazones / 40 bloques.'
    - <prefix>&8• &7Can melt ice, snow bloques, flat snow layers, y cook raw mob drops.
  ice_cube:
    description:
      - "<prefix>&8• &bFrost Walker&7: el agua se congela bajo tus pies al moverte."
      - "<prefix>&8• &bIce Slide&7: todos los bloques se sienten resbaladizos; sobre hielo obtienes &eSpeed II&7."
      - "<prefix>&8• &bPúa de hielo&7: pulsa &dF &8(Swap Item with Offhand)&7 para disparar una púa helada. Cooldown: &e3s&7."
      - "<prefix>&8• &7Las púas aplican &bSlowness III&7 por &e5s&7 y &7Weakness II&7 por &e10s&7."
      - "<prefix>&8• &7Los golpes cuerpo a cuerpo aplican &bSlowness I&7 por &e5s&7."
      - "<prefix>&8• &bMuro de hielo&7: &dAgáchate + clic izquierdo&7 crea un muro temporal a unos &e4 bloques&7 delante. Enfriamiento: &e60s&7."
      - "<prefix>&8• &7Efectos pasivos: &aStrength I&7 y &9Resistance I&7."
  the_diver:
    description:
    - '<prefix>&8• &7Estilo: como &bThe Deep&7.'
    - <prefix>&8• &bWater Breathing&7, &bDolphin's Grace VIII&7, &eSpeed mientras bajo el agua&7 y &3Conduit Power II&7 are active permanentemente.
    - '<prefix>&8• &bSonar&7: &dAgacharse + clic izquierdo al aire&7 mientras bajo el agua para revelar entidades cercanas.'
    - "<prefix>&8• &bRiptide Dash&7: press &dF &8(Swap Item with Offhand)&7 in water or rain, similar to Riptide IV without holding a trident."
    - '<prefix>&8• &7Mejoras pasivas: &aFuerza II&7 y &9Resistencia I&7.'
    - <prefix>&8• &7While bajo el agua, Fuerza y Resistencia are increased by &a+1 level&7.
  jumper:
    description:
    - <prefix>&8• &aFuerza I&7 is active permanentemente.
    - '<prefix>&8• &aSalto explosivo&7: pulsa &dF &8(Swap Item with Offhand)&7 for &aJump Boost V&7 y no daño por caída mientras active.'
    - '<prefix>&8• &7Default active time: &e10s&7. Enfriamiento: &e15s&7.'
  shockwave:
    description:
    - '<prefix>&8• &7Mejoras pasivas: &aFuerza II&7 y &9Resistencia I&7.'
    - '<prefix>&8• &eShockwave&7: pulsa &dF &8(Swap Item with Offhand)&7 para liberar a 10-block knockback wave.'
    - '<prefix>&8• &7Daño: &c3 corazones&7 to jugadores, &c6 corazones&7 to mobs. Enfriamiento: &e2min&7.'
  vision:
    description:
    - '<prefix>&8• &bRayos X&7: &dAgacharse + clic izquierdo al aire&7 para revelar entidades cercanas.'
    - '<prefix>&8• &7Default range: &e35 bloques&7.'
  the_runner:
    description:
    - '<prefix>&8• &7Estilo: como &eA-Tlluvia&7.'
    - '<prefix>&8• &eRunner Speed&7: pulsa &dF &8(Swap Item with Offhand)&7 para cambiar entre Speed X, XI, XII, XV y off.'
    - '<prefix>&8• &eImpact Run&7: running mediante entities at Speed X+ deals &c6 corazones&7, plus &c+1 heart&7 per extra speed level.'
    - '<prefix>&8• &7Mejoras pasivas: &aFuerza II&7, &9Resistencia I&7, &c5 extra corazones&7 y sin enfriamiento de melee.'
  teleporter:
    description:
    - '<prefix>&8• &5Blink&7: pulsa &dF &8(Swap Item with Offhand)&7 para teleportarte up to &e35 bloques&7.'
    - '<prefix>&8• &7Enfriamiento: &e2 seconds&7. Includes &aFuerza I&7 y &9Resistencia I&7.'
  teleporter_v_one:
    description:
    - <prefix>&8• &3V One Upgrade&7 for Teleporter.
    - '<prefix>&8• &5Blink&7: pulsa &dF &8(Swap Item with Offhand)&7 para teleportarte up to &e50 bloques&7.'
    - '<prefix>&8• &7Mejoras pasivas: &aFuerza II&7 y &9Resistencia III&7.'
  fly:
    description:
    - <prefix>&8• &aVuelo&7 está activado automáticamente.
    - '<prefix>&8• &6Light Inicio de salto&7: &dAgacharse&7, mira hacia arriba y salta for a weaker launch.'
    - <prefix>&8• &7Includes &aFuerza I&7 y &9Resistencia I&7.
  speedster:
    description:
    - '<prefix>&8• &eSuper Speed&7: pulsa &dF &8(Swap Item with Offhand)&7 para alternar it on/off.'
    - <prefix>&8• &7Includes a small &9Resistencia&7 bonus mientras active.
  strength:
    description:
    - <prefix>&8• &aFuerza&7 is active permanentemente mientras you own this habilidad.
    - <prefix>&8• &7Includes a small &9Resistencia&7 bonus.
  the_ghost:
    description:
    - '<prefix>&8• &5Ghost Mode&7: pulsa &dF &8(Swap Item with Offhand)&7 para alternar invisibility.'
    - <prefix>&8• &7When activado you receive &5Invisibility II&7 y mobs will not objetivo you.
    - <prefix>&8• &7Existing mob objetivos are cleared mientras Ghost Mode is active.
    - '<prefix>&8• &7Mejoras pasivas: &9Resistencia II&7, &aFuerza I&7 y &6Resistencia al fuego&7.'
    - <prefix>&8• &7Visión Calorífica deals no damage to The Ghost.
  fire:
    description:
    - <prefix>&8• &cFire Aura&7 ignites nearby enemies automatically.
    - <prefix>&8• &6Resistencia al fuego&7 is activado.
    - <prefix>&8• &7Includes &aFuerza I&7 y &9Resistencia I&7.
    - <prefix>&8• &7Vanilla right-click fire placement con &6Flint y Steel&7 o &6Fire Charges&7 is blocked mientras you own this habilidad.
  the_worm:
    description:
    - <prefix>&8• &7Very fast digging con &eHaste IV&7, focused on dirt, grass, gravel y sand gameplay.
    - <prefix>&8• &dF &8(Swap Item with Offhand)&7 toggles &bNight Vision&7.
    - '<prefix>&8• &7Mejoras pasivas: &aFuerza I&7 y &9Resistencia I&7.'
  flash_light:
    description:
    - '<prefix>&8• &7Estilo: como &eStarlight&7. Passive: &aFuerza II&7 y &9Resistencia I&7.'
    - '<prefix>&8• &dF &8(Swap Item with Offhand)&7 blinds jugadores, mobs y animales in &e15 bloques&7 for &e20s&7. Enfriamiento: &e2min&7.'
    - <prefix>&8• &dAgacharse + clic izquierdo&7 fires a 15-block light beam con &c2 corazones&7, tiny quemadura y knockback.
  stormstrike:
    description:
    - '<prefix>&8• &7Estilo: como &eStormfront&7. &3V One solo&7 con electric salta start y &e2.75x&7 fly speed.'
    - '<prefix>&8• &dF &8(Swap Item with Offhand)&7 fires a jagged 35-block lightning beam for max &e6s&7. Daño: &c3 corazones&7 y Slowness. Only overheats después de full use.'
    - <prefix>&8• &dAgacharse + clic izquierdo&7 summons &e4 lightning strikes&7. Every 5th melee golpe calls a lightning strike.
    - '<prefix>&8• &7Agacharse fall impact: 6 lightning strikes in a 10-block radius. Enfriamiento: &e100s&7.'
    - '<prefix>&8• &7Mejoras pasivas: &aFuerza III&7, &9Resistencia III&7 y &c10 extra corazones&7.'
  fire_sonic:
    description:
    - '<prefix>&8• &cFlame Aura&7: cada melee golpe applies heavy quemadura.'
    - <prefix>&8• &dF &8(Swap Item with Offhand)&7 fires a thin flame beam for max &e2s&7. Damage ticks are slower than Visión Calorífica y solo overheat después de full use.
  toxic_cloud:
    description:
    - '<prefix>&8• &7Mejoras pasivas: &aFuerza I&7 y &9Resistencia I&7. Immune to veneno.'
    - '<prefix>&8• &dF &8(Swap Item with Offhand)&7 releases veneno gas in front of you, applying &2Veneno IV&7. Enfriamiento: &e2min&7.'
    - <prefix>&8• &dAgacharse + clic izquierdo&7 shoots short veneno vomit for &c1.5 corazones&7 y &2Veneno IV&7. Melee golpes apply short Veneno I.
  the_countess:
    description:
    - '<prefix>&8• &7Estilo: como &cCrimson Countess&7.'
    - '<prefix>&8• &dF &8(Swap Item with Offhand)&7 launches a fireball. Enfriamiento: &e3s&7. Daño: &c2-4 corazones&7.'
    - <prefix>&8• &7Double-salta con small fire animation. Melee golpes apply quemadura.
    - '<prefix>&8• &7Mejoras pasivas: &aFuerza II&7, &9Resistencia I&7 y &6Resistencia al fuego&7.'
  the_warrior:
    description:
    - '<prefix>&8• &7Estilo: como &eQueen Maeve&7.'
    - '<prefix>&8• &7Mejoras pasivas: &aFuerza III&7, &9Resistencia II&7, &dRegeneración I&7 y &c10 extra corazones&7.'
    - <prefix>&8• &7High fall protection, strong double-salta y small explosive landing from &e6+ bloques&7 solo mientras sneaking.
  the_headpopper:
    description:
    - '<prefix>&8• &7Estilo: como &cVictoria Neuman&7.'
    - <prefix>&8• &dAgacharse + clic izquierdo&7 marks a objetivo up to &e30 bloques&7 for a &c3s&7 cuenta atrás.
    - '<prefix>&8• &7Daño: &c12.5 corazones&7, mobs/animales take &cx2.5&7. Enfriamiento: &e20s&7.'
    - '<prefix>&8• &dF &8(Swap Item with Offhand)&7 damages all nearby living objetivos for &c25% current curarth&7. Enfriamiento: &e2min&7.'
    - '<prefix>&8• &7Mejoras pasivas: &aFuerza II&7, &9Resistencia II&7, &dRegeneración I&7 y Visión Calorífica immunity.'
  spider_weaver:
    description:
    - '<prefix>&8• &7Estilo: como &fWebweaver&7.'
    - '<prefix>&8• &dF &8(Swap Item with Offhand)&7 o &dAgacharse + clic izquierdo&7 shoots a web projectile. Enfriamiento: &e3s&7.'
    - <prefix>&8• &7Targets take damage, are slowed/fixed y larger cobweb clusters can stay up to &e1min&7.
    - '<prefix>&8• &7Can climb walls y takes no daño por caída. Passive: &aFuerza I&7, &9Resistencia I&7 y &dRegeneración I&7.'
  heal_angel:
    description:
    - '<prefix>&8• &7Estilo: como &fPrivate Angel&7. &3V One solo&7.'
    - '<prefix>&8• &7Mejoras pasivas: &aFuerza II&7, &9Resistencia II&7, &dRegeneración II&7 y &c5 extra corazones&7.'
    - '<prefix>&8• &dAgacharse + melee golpe&7 cura the objetivo for &a10% max curarth&7, at least &a1 heart&7, y deals no damage. Enfriamiento: &e1s&7.'
    - '<prefix>&8• &dF &8(Swap Item with Offhand)&7 ordens a objetivoed mob/animal to attack nearby objetivos except you for &e2min&7. Enfriamiento: &e30s&7.'
  submarine:
    description:
    - '<prefix>&8• &7Estilo: como &bTorpedo&7. &3V One solo&7.'
    - '<prefix>&8• &7Passive: &aFuerza II&7, &9Resistencia II&7, Water Breathing, Dolphin''s Grace y Conduit Power.'
    - '<prefix>&8• &7In agua: &aFuerza V&7 y Regeneración.'
    - <prefix>&8• &dF &8(Swap Item with Offhand)&7 uses a double-strength dash con &e1s cooldown&7. &dAgacharse + clic izquierdo&7 toggles stronger sonar con &e65 bloques&7 range.
  the_detonator:
    description:
    - '<prefix>&8• &7Estilo: como &cNaqib&7.'
    - '<prefix>&8• &dAgacharse + clic izquierdo&7 starts a cancellable cuenta atrás, then releases a huge self-centered explosion. Enfriamiento: &e10s&7.'
    - '<prefix>&8• &7Passive: &aFuerza II&7, &9Resistencia I&7 y &6Resistencia al fuego&7.'
    - <prefix>&8• &7Melee golpes quemadura objetivos. Every 3rd golpe triggers a small explosive golpe.
  the_veteran:
    description:
    - '<prefix>&8• &7Estilo: como &eSoldier Boy&7.'
    - <prefix>&8• &7High &aFuerza&7, &9Resistencia&7 y &6Resistencia al fuego&7.
    - '<prefix>&8• &dAgacharse + clic izquierdo&7: &e5s charge&7, then Chest Beam.'
    - '<prefix>&8• &7Beam: high damage, block quemadura y player habilidad removal.'
    - <prefix>&8• &7Starts con a strong point-blank blast y mushroom cloud.
  granted_tip: <prefix>&8• &7Use &f/cv stats&7 anytime to view your current ability and controls.
