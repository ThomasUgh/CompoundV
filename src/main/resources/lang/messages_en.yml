  v_one_upgrade: "<prefix>&3V One&7 upgraded your current power."
  v_one_no_upgrade: "<prefix>&7V One did not react with this ability yet."

  only_drinkable: "<prefix>&cCompound V serums can only be used as normal drinkable potions. V-Null Virus is throwable."

ability:
  granted_header: "<prefix>&8━━━━━━━━ &aAbility Unlocked &8━━━━━━━━"
  granted_name: "<prefix>&7You unlocked &a&l{name}&r&7 through &b{potion}&7."
  controls_header: "<prefix>&8────── &aControls & Effects &8──────"
  granted_expires: "<prefix>&8• &7Duration: &e{minutes}m {seconds}s"
  granted_footer: "<prefix>&8━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

  lost_on_death: "<prefix>&cYou lost your ability on death."
  expired: "<prefix>&eYour temporary ability has expired."
  removed_admin: "<prefix>&cYour ability was removed by an admin."
  removed_anti_v: "<prefix>&cAnti V removed your ability."

  the_patriot:
    description:
      - "<prefix>&8• &7Style: like &cHomelander&7."
      - "<prefix>&8• &aFlight&7 is enabled automatically."
      - "<prefix>&8• &cHeat Vision&7: press &dF&7 to toggle. Default: &e5 hearts&7, &e44 blocks&7."
      - "<prefix>&8• &bXRay&7: &dSneak + Left-Click Air&7 to reveal nearby entities."
      - "<prefix>&8• &6Jump Start&7: &dSneak&7, look up and jump to launch."
      - "<prefix>&8• &7Passive boosts: &aStrength&7, &9Resistance&7, &dRegeneration&7 and &cBonus Hearts&7."
  the_patriot_v_one:
    description:
      - "<prefix>&8• &7Style: like &cHomelander&7."
      - "<prefix>&8• &aFlight&7 is enabled automatically with stronger V One boosts."
      - "<prefix>&8• &cHeat Vision&7: press &dF&7 to toggle. Default: &e4.725 hearts&7, &e50 blocks&7."
      - "<prefix>&8• &bXRay&7: &dSneak + Left-Click Air&7 to reveal nearby entities."
      - "<prefix>&8• &6Jump Start&7: &dSneak&7, look up and jump to launch."
      - "<prefix>&8• &7Passive boosts: &aStrength&7, &9Resistance&7, &dRegeneration&7, &6Fire Resistance&7 and &cBonus Hearts&7."
  sonic_boom:
    description:
      - "<prefix>&8• &7Style: like &3Bombsight&7."
      - "<prefix>&8• &aFlight&7 is enabled automatically."
      - "<prefix>&8• &6Jump Start&7: &dSneak&7, look up and jump. Stronger than Flight, slightly weaker than Patriot."
      - "<prefix>&8• &3Sonic Beam&7: &dSneak + Left-Click&7 to fire a Warden-like sonic beam. Cooldown: &e5s&7."
      - "<prefix>&8• &cExplosive Melee&7: every 2nd hit adds a small blast; crits hit harder."
      - "<prefix>&8• &cExplosive Landing&7: &dSneak&7 when landing after a high fall. Cooldown: &e60s&7."
      - "<prefix>&8• &7Passive boosts: &aStrength IV&7 and &9Resistance IV&7."
  size_changer:
    description:
      - "<prefix>&8• &7Passive boosts: &aStrength II&7 and &9Resistance II&7."
      - "<prefix>&8• &dSneak + Left-Click + look up&7: become &52x bigger&7, double damage, &aJump Boost II&7 and &c+10 hearts&7 for max &e1min&7."
      - "<prefix>&8• &dSneak + Left-Click + look down&7: become &53.5x smaller&7 for max &e2min&7."
      - "<prefix>&8• &7While transformed, &dSneak + Left-Click + look up/down&7 returns you to normal instantly."
      - "<prefix>&8• &7Cooldown starts after returning to normal."
  heat_vision:
    description:
      - "<prefix>&8• &bHeat Vision&7: press &dF&7 to toggle the beam."
      - "<prefix>&8• &7Stages: &bI&7 = 1.35 hearts / 30 blocks, &aII&7 = 2 hearts / 35 blocks."
      - "<prefix>&8• &7More stages: &6III&7 = 2.25 hearts / 37 blocks, &cIV&7 = 2.7 hearts / 40 blocks."
      - "<prefix>&8• &7Can melt ice, snow blocks, flat snow layers, and cook raw mob drops."
  the_diver:
    description:
      - "<prefix>&8• &7Style: like &bThe Deep&7."
      - "<prefix>&8• &bWater Breathing&7, &bDolphin's Grace VIII&7, &eSpeed while underwater&7 and &3Conduit Power II&7 are active permanently."
      - "<prefix>&8• &bSonar&7: &dSneak + Left-Click Air&7 while underwater to reveal nearby entities."
      - "<prefix>&8• &bRiptide Dash&7: &dSneak + Right-Click&7 in water or rain, similar to Riptide IV without holding a trident."
      - "<prefix>&8• &7Passive boosts: &aStrength II&7 and &9Resistance I&7."
      - "<prefix>&8• &7While underwater, Strength and Resistance are increased by &a+1 level&7."
  jumper:
    description:
      - "<prefix>&8• &aStrength I&7 is active permanently."
      - "<prefix>&8• &aJump Burst&7: press &dF&7 for &aJump Boost V&7 and no fall damage while active."
      - "<prefix>&8• &7Default active time: &e10s&7. Cooldown: &e15s&7."
  shockwave:
    description:
      - "<prefix>&8• &7Passive boosts: &aStrength II&7 and &9Resistance I&7."
      - "<prefix>&8• &eShockwave&7: press &dF&7 to release a 10-block knockback wave."
      - "<prefix>&8• &7Damage: &c3 hearts&7 to players, &c6 hearts&7 to mobs. Cooldown: &e2min&7."
  vision:
    description:
      - "<prefix>&8• &bXRay&7: &dSneak + Left-Click Air&7 to reveal nearby entities."
      - "<prefix>&8• &7Default range: &e35 blocks&7."
  the_runner:
    description:
      - "<prefix>&8• &7Style: like &eA-Train&7."
      - "<prefix>&8• &eRunner Speed&7: press &dF&7 to cycle Speed X, XI, XII, XV and off."
      - "<prefix>&8• &eImpact Run&7: running through entities at Speed X+ deals &c6 hearts&7, plus &c+1 heart&7 per extra speed level."
      - "<prefix>&8• &7Passive boosts: &aStrength II&7, &9Resistance I&7, &c5 extra hearts&7 and no melee cooldown."
  teleporter:
    description:
      - "<prefix>&8• &5Blink&7: press &dF&7 to teleport up to &e50 blocks&7."
      - "<prefix>&8• &7Cooldown: &e2 seconds&7. Includes &9Resistance II&7."
  fly:
    description:
      - "<prefix>&8• &aFlight&7 is enabled automatically."
      - "<prefix>&8• &6Light Jump Start&7: &dSneak&7, look up and jump for a weaker launch."
      - "<prefix>&8• &7Launch flight speed is around &e1.5x&7 normal flight."
  speedster:
    description:
      - "<prefix>&8• &eSuper Speed&7: press &dF&7 to toggle it on/off."
      - "<prefix>&8• &7Includes a small &9Resistance&7 bonus while active."
  strength:
    description:
      - "<prefix>&8• &aStrength&7 is active permanently while you own this ability."
      - "<prefix>&8• &7Includes a small &9Resistance&7 bonus."
  invisibility:
    description:
      - "<prefix>&8• &5Ghost Mode&7: press &dF&7 to toggle invisibility."
      - "<prefix>&8• &7When enabled you receive &5Invisibility II&7 and mobs will not target you."
      - "<prefix>&8• &7Existing mob targets are cleared while Ghost Mode is active."
      - "<prefix>&8• &7Passive boosts: &9Resistance II&7, &aStrength I&7 and &6Fire Resistance&7."
      - "<prefix>&8• &7Heat Vision deals no damage to The Ghost."
  fire:
    description:
      - "<prefix>&8• &cFire Aura&7 ignites nearby enemies automatically."
      - "<prefix>&8• &6Fire Resistance&7 is enabled."
      - "<prefix>&8• &7Vanilla right-click fire placement with &6Flint and Steel&7 or &6Fire Charges&7 is blocked while you own this ability."
  the_veteran:
    description:
      - "<prefix>&8• &7Style: like &eSoldier Boy&7."
      - "<prefix>&8• &7High &aStrength&7, &9Resistance&7 and &6Fire Resistance&7."
      - "<prefix>&8• &dSneak + Left-Click&7: &e5s charge&7, then Chest Beam."
      - "<prefix>&8• &7Beam: high damage, block burn and player ability removal."
      - "<prefix>&8• &7Starts with a strong point-blank blast and mushroom cloud."

