language_file_version: 29
prefix: "&8[&b&lCV&r&8] "

general:
  no_permission: "<prefix>&cYou do not have permission to do this."
  player_not_found: "<prefix>&cPlayer not found."
  reloaded: "<prefix>&aCompoundV has been reloaded."
  not_a_player: "<prefix>&cThis command can only be used by players."
  only_players: "<prefix>&cThis command can only be used by players."

potion:
  drinking: "<prefix>&7The &bserum&7 is activating..."
  drink_temp_v: "<prefix>&aTemp V&7 is activating. Your ability will only last for a limited time."
  drink_v_one: "<prefix>&3V One&7 is activating. Brace yourself."
  drink_anti_v: "<prefix>&cAnti V&7 is removing your active ability."
  no_ability: "<prefix>&7You do not have an active ability."
  milk_blocked: "<prefix>&cMilk cannot remove Compound V powers. Use Anti V or V-Null mechanics instead."
  no_chances: "<prefix>&cThis potion has no valid abilities configured. Please contact an admin."
  roll_failed: "<prefix>&cThe serum could not be processed. Please contact an admin."

  drink_v_null: "<prefix>&2V-Null Virus&7 is spreading..."
  temp_v_extended: "<prefix>&aTemp V&7 was extended. Same ability, longer duration."
  compound_v_after_temp: "<prefix>&bCompound V&7 bonded with your temporary ability. A permanent Compound V ability will activate after Temp V expires."
  compound_v_delayed_granted: "<prefix>&bCompound V&7 has now permanently activated."
  temp_v_blocked_by_compound: "<prefix>&aTemp V&7 cannot override permanent Compound V. Only minor side effects occurred."
  no_effect_compound_active: "<prefix>&7Compound V has no effect while you already have a permanent ability. Use &cAnti V&7 first."
  no_effect_v_one_active: "<prefix>&7Your V One system rejects more V. Nothing happens."
  v_one_upgrade: "<prefix>&3V One&7 upgraded your current power."
  v_one_no_upgrade: "<prefix>&7V One did not react with this ability yet."

  only_drinkable: "<prefix>&cCompound V serums can only be used as normal drinkable potions. V-Null Virus is throwable."

ability:
  granted_header: "<prefix>&8━━━━━━━━ &aAbility Unlocked &8━━━━━━━━"
  granted_name: "<prefix>&7You unlocked &a&l{name}&r&7 through &b{potion}&7."
  controls_header: "<prefix>&8────── &aControls & Effects &8──────"
  granted_expires: "<prefix>&8• &7Duration: &e{minutes}m {seconds}s"
  granted_tip: "<prefix>&8• &7Use &f/cv stats&7 anytime to view your current ability and controls."
  granted_footer: "<prefix>&8━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

  lost_on_death: "<prefix>&cYou lost your ability on death."
  expired: "<prefix>&eYour temporary ability has expired."
  removed_admin: "<prefix>&cYour ability was removed by an admin."
  removed_anti_v: "<prefix>&cAnti V removed your ability."

  the_patriot:
    description:
      - "<prefix>&8• &7Style: like &cHomelander&7."
      - "<prefix>&8• &aFlight&7 is enabled automatically."
      - "<prefix>&8• &cHeat Vision&7: press &dF &8(Swap Item with Offhand)&7 to toggle. Default: &e5 hearts&7, &e44 blocks&7."
      - "<prefix>&8• &bXRay&7: &dSneak + Left-Click Air&7 to reveal nearby entities."
      - "<prefix>&8• &6Jump Start&7: &dSneak&7, look up and jump to launch."
      - "<prefix>&8• &cSpeed Dash&7: &dSneak + hotbar scroll&7 to burst up to &e25 blocks&7 forward."
      - "<prefix>&8• &cForward Leap&7: &dSneak + jump + move forward&7 for a flat 10-15 block burst."
      - "<prefix>&8• &7Passive boosts: &aStrength&7, &9Resistance&7, &dRegeneration&7 and &cBonus Hearts&7."
  the_patriot_v_one:
    description:
      - "<prefix>&8• &7Style: like &cHomelander&7."
      - "<prefix>&8• &aFlight&7 is enabled automatically with stronger V One boosts."
      - "<prefix>&8• &cHeat Vision&7: press &dF &8(Swap Item with Offhand)&7 to toggle. Default: &e4.725 hearts&7, &e50 blocks&7."
      - "<prefix>&8• &bXRay&7: &dSneak + Left-Click Air&7 to reveal nearby entities."
      - "<prefix>&8• &6Jump Start&7: &dSneak&7, look up and jump to launch."
      - "<prefix>&8• &cSpeed Dash&7: &dSneak + hotbar scroll&7 to burst up to &e25 blocks&7 forward."
      - "<prefix>&8• &cForward Leap&7: &dSneak + jump + move forward&7 for a flat 10-15 block burst."
      - "<prefix>&8• &7Passive boosts: &aStrength&7, &9Resistance&7, &dRegeneration&7, &6Fire Resistance&7 and &cBonus Hearts&7."
  sonic_boom:
    description:
      - "<prefix>&8• &7Style: like &3Bombsight&7."
      - "<prefix>&8• &aFlight&7 is enabled automatically."
      - "<prefix>&8• &6Jump Start&7: &dSneak&7, look up and jump. Stronger than Flight, slightly weaker than Patriot."
      - "<prefix>&8• &3Sonic Beam&7: &dSneak + Left-Click&7 to fire a Warden-like sonic beam. Cooldown: &e3s&7."
      - "<prefix>&8• &cExplosive Melee&7: every 2nd hit adds a small blast; crits hit harder."
      - "<prefix>&8• &cExplosive Landing&7: &dSneak&7 when landing after a high fall. Cooldown: &e60s&7."
      - "<prefix>&8• &7Passive boosts: &aStrength IV&7 and &9Resistance IV&7."
  size_changer:
    description:
      - "<prefix>&8• &7Passive boosts: &aStrength I&7 and &9Resistance I&7."
      - "<prefix>&8• &dSneak + Left-Click + look up&7: become &52x bigger&7 with reduced bonus damage for max &e1min&7."
      - "<prefix>&8• &dSneak + Left-Click + look down&7: become &53.5x smaller&7 for max &e2min&7."
      - "<prefix>&8• &7While transformed, &dSneak + Left-Click + look up/down&7 returns you to normal instantly."
      - "<prefix>&8• &7Cooldown starts after returning to normal."
  size_changer_v_one:
    description:
      - "<prefix>&8• &3V One Upgrade&7 for SizeChanger. Passive: &aStrength I&7 and &9Resistance I&7."
      - "<prefix>&8• &dSneak + Left-Click + look up&7: about &53x bigger&7 with reduced V-One bonus damage."
      - "<prefix>&8• &dSneak + Left-Click + look down&7: about &57x smaller&7."
      - "<prefix>&8• &7Only obtainable by upgrading an active SizeChanger with &3V One&7."
  heat_vision:
    description:
      - "<prefix>&8• &bHeat Vision&7: press &dF &8(Swap Item with Offhand)&7 to toggle the beam."
      - "<prefix>&8• &7Stages: &bI&7 = 1.35 hearts / 30 blocks, &aII&7 = 2 hearts / 35 blocks."
      - "<prefix>&8• &7More stages: &6III&7 = 2.25 hearts / 37 blocks, &cIV&7 = 2.7 hearts / 40 blocks."
      - "<prefix>&8• &7Can melt ice, snow blocks, flat snow layers, and cook raw mob drops."
  ice_cube:
    description:
      - "<prefix>&8• &bFrost Walker&7: water freezes under you while moving."
      - "<prefix>&8• &bIce Slide&7: every block feels slippery; on ice you get &eSpeed II&7."
      - "<prefix>&8• &bIce Spike&7: press &dF &8(Swap Item with Offhand)&7 to shoot a small frozen spike. Cooldown: &e3s&7."
      - "<prefix>&8• &7Ice spikes apply &bSlowness III&7 for &e5s&7 and &7Weakness II&7 for &e10s&7."
      - "<prefix>&8• &7Melee hits apply &bSlowness I&7 for &e5s&7."
      - "<prefix>&8• &bIce Wall&7: &dSneak + Left-Click&7 creates a temporary wall about &e4 blocks&7 ahead. Cooldown: &e60s&7."
      - "<prefix>&8• &7Passive boosts: &aStrength I&7 and &9Resistance I&7."
  the_diver:
    description:
      - "<prefix>&8• &7Style: like &bThe Deep&7."
      - "<prefix>&8• &bWater Breathing&7, &bDolphin's Grace VIII&7, &eSpeed while underwater&7 and &3Conduit Power II&7 are active permanently."
      - "<prefix>&8• &bSonar&7: &dSneak + Left-Click Air&7 while underwater to reveal nearby entities."
      - "<prefix>&8• &bRiptide Dash&7: press &dF &8(Swap Item with Offhand)&7 in water or rain, similar to Riptide IV without holding a trident."
      - "<prefix>&8• &7Passive boosts: &aStrength II&7 and &9Resistance I&7."
      - "<prefix>&8• &7While underwater, Strength and Resistance are increased by &a+1 level&7."
  jumper:
    description:
      - "<prefix>&8• &aStrength I&7 is active permanently."
      - "<prefix>&8• &aJump Burst&7: press &dF &8(Swap Item with Offhand)&7 for &aJump Boost V&7 and no fall damage while active."
      - "<prefix>&8• &7Default active time: &e10s&7. Cooldown: &e15s&7."
  shockwave:
    description:
      - "<prefix>&8• &7Passive boosts: &aStrength II&7 and &9Resistance I&7."
      - "<prefix>&8• &eShockwave&7: press &dF &8(Swap Item with Offhand)&7 to release a 10-block knockback wave."
      - "<prefix>&8• &7Damage: &c3 hearts&7 to players, &c6 hearts&7 to mobs. Cooldown: &e2min&7."
  vision:
    description:
      - "<prefix>&8• &bXRay&7: &dSneak + Left-Click Air&7 to reveal nearby entities."
      - "<prefix>&8• &7Default range: &e35 blocks&7."
  the_runner:
    description:
      - "<prefix>&8• &7Style: like &eA-Train&7."
      - "<prefix>&8• &eRunner Speed&7: press &dF &8(Swap Item with Offhand)&7 to cycle Speed X, XI, XII, XV and off."
      - "<prefix>&8• &eImpact Run&7: running through entities at Speed X+ deals &c6 hearts&7, plus &c+1 heart&7 per extra speed level."
      - "<prefix>&8• &7Passive boosts: &aStrength II&7, &9Resistance I&7, &c5 extra hearts&7 and no melee cooldown."
  teleporter:
    description:
      - "<prefix>&8• &5Blink&7: press &dF &8(Swap Item with Offhand)&7 to teleport up to &e35 blocks&7."
      - "<prefix>&8• &7Cooldown: &e2 seconds&7. Includes &aStrength I&7 and &9Resistance I&7."
  teleporter_v_one:
    description:
      - "<prefix>&8• &3V One Upgrade&7 for Teleporter."
      - "<prefix>&8• &5Blink&7: press &dF &8(Swap Item with Offhand)&7 to teleport up to &e50 blocks&7."
      - "<prefix>&8• &7Passive boosts: &aStrength II&7 and &9Resistance III&7."
  fly:
    description:
      - "<prefix>&8• &aFlight&7 is enabled automatically."
      - "<prefix>&8• &6Light Jump Start&7: &dSneak&7, look up and jump for a weaker launch."
      - "<prefix>&8• &7Includes &aStrength I&7 and &9Resistance I&7."
  speedster:
    description:
      - "<prefix>&8• &eSuper Speed&7: press &dF &8(Swap Item with Offhand)&7 to toggle it on/off."
      - "<prefix>&8• &7Includes a small &9Resistance&7 bonus while active."
  strength:
    description:
      - "<prefix>&8• &aStrength&7 is active permanently while you own this ability."
      - "<prefix>&8• &7Includes a small &9Resistance&7 bonus."
  the_ghost:
    description:
      - "<prefix>&8• &5Ghost Mode&7: press &dF &8(Swap Item with Offhand)&7 to toggle invisibility."
      - "<prefix>&8• &7When enabled you receive &5Invisibility II&7 and mobs will not target you."
      - "<prefix>&8• &7Existing mob targets are cleared while Ghost Mode is active."
      - "<prefix>&8• &7Passive boosts: &9Resistance II&7, &aStrength I&7 and &6Fire Resistance&7."
      - "<prefix>&8• &7Heat Vision deals no damage to The Ghost."
  fire:
    description:
      - "<prefix>&8• &cFire Aura&7 ignites nearby enemies automatically."
      - "<prefix>&8• &6Fire Resistance&7 is enabled."
      - "<prefix>&8• &7Includes &aStrength I&7 and &9Resistance I&7."
      - "<prefix>&8• &7Vanilla right-click fire placement with &6Flint and Steel&7 or &6Fire Charges&7 is blocked while you own this ability."
  the_worm:
    description:
      - "<prefix>&8• &7Very fast digging with &eHaste IV&7, focused on dirt, grass, gravel and sand gameplay."
      - "<prefix>&8• &dF &8(Swap Item with Offhand)&7 toggles &bNight Vision&7."
      - "<prefix>&8• &7Passive boosts: &aStrength I&7 and &9Resistance I&7."
  flash_light:
    description:
      - "<prefix>&8• &7Style: like &eStarlight&7. Passive: &aStrength II&7 and &9Resistance I&7."
      - "<prefix>&8• &dF &8(Swap Item with Offhand)&7 blinds players, mobs and animals in &e15 blocks&7 for &e20s&7. Cooldown: &e2min&7."
      - "<prefix>&8• &dSneak + Left-Click&7 fires a 15-block light beam with &c2 hearts&7, tiny burn and knockback."
  stormstrike:
    description:
      - "<prefix>&8• &7Style: like &eStormfront&7. &3V One only&7 with electric jump start and &e2.75x&7 fly speed."
      - "<prefix>&8• &dF &8(Swap Item with Offhand)&7 fires a jagged 35-block lightning beam for max &e6s&7. Damage: &c2.55 hearts&7 and Slowness. Only overheats after full use."
      - "<prefix>&8• &dSneak + Left-Click&7 summons &e4 real lightning strikes&7. Every 5th melee hit calls a lightning strike."
      - "<prefix>&8• &7Sneak fall impact: 6 lightning strikes in a 10-block radius. Cooldown: &e100s&7."
      - "<prefix>&8• &7Passive boosts: &aStrength III&7, &9Resistance III&7 and &c10 extra hearts&7."
  fire_sonic:
    description:
      - "<prefix>&8• &cFlame Aura&7: every melee hit applies heavy burn."
      - "<prefix>&8• &dF &8(Swap Item with Offhand)&7 fires a thin flame beam for max &e2s&7. Damage ticks are close to Heat Vision speed but weaker and only overheat after full use."
  toxic_cloud:
    description:
      - "<prefix>&8• &7Passive boosts: &aStrength I&7 and &9Resistance I&7. Immune to poison."
      - "<prefix>&8• &dF &8(Swap Item with Offhand)&7 releases poison gas in front of you, applying &2Poison IV&7. Cooldown: &e2min&7."
      - "<prefix>&8• &dSneak + Left-Click&7 shoots short poison vomit for &c1.5 hearts&7 and &2Poison IV&7. Melee hits apply short Poison I."
  the_countess:
    description:
      - "<prefix>&8• &7Style: like &cCrimson Countess&7."
      - "<prefix>&8• &dF &8(Swap Item with Offhand)&7 launches a fireball. Cooldown: &e5s&7. Damage: &c2-4 hearts&7."
      - "<prefix>&8• &7Double-jump with small fire animation. Melee hits apply burn."
      - "<prefix>&8• &7Passive boosts: &aStrength II&7, &9Resistance I&7 and &6Fire Resistance&7."
  the_warrior:
    description:
      - "<prefix>&8• &7Style: like &eQueen Maeve&7."
      - "<prefix>&8• &7Passive boosts: &aStrength III&7, &9Resistance II&7, &dRegeneration I&7 and &c10 extra hearts&7."
      - "<prefix>&8• &7High fall protection, strong double-jump and small explosive landing from &e6+ blocks&7 only while sneaking."
  the_headpopper:
    description:
      - "<prefix>&8• &7Style: like &cVictoria Neuman&7."
      - "<prefix>&8• &dSneak + Left-Click&7 marks a target up to &e30 blocks&7 for a &c3s&7 countdown."
      - "<prefix>&8• &7Damage: &c12.5 hearts&7, mobs/animals take &cx2.5&7. Cooldown: &e20s&7."
      - "<prefix>&8• &dF &8(Swap Item with Offhand)&7 damages all nearby living targets for &c25% current health&7. Cooldown: &e2min&7."
      - "<prefix>&8• &7Passive boosts: &aStrength II&7, &9Resistance II&7, &dRegeneration I&7 and Heat Vision immunity."
  bloodweaver:
    description:
      - "<prefix>&8• &7Style: like &cMarie Moreau&7."
      - "<prefix>&8• &dF &8(Swap Item with Offhand)&7 fires &cBlood Lash&7 up to &e25 blocks&7. Cooldown: &e3s&7."
      - "<prefix>&8• &7Blood Lash deals &c2-4 hearts&7, slows the target and applies bleeding for &e3s&7."
      - "<prefix>&8• &7Every &ethird melee hit&7 applies &e2s&7 bleeding with &c0.5 hearts/s&7."
      - "<prefix>&8• &dSneak + Left-Click&7 and keep sneaking for &e3s&7 to cast &cBlood Rupture&7 in a &e15 block&7 radius."
      - "<prefix>&8• &7Blood Rupture lifts targets &e3 blocks&7, roots them for &e5s&7, deals &c2 hearts/s&7 and throws survivors back."
      - "<prefix>&8• &7Cost: &c2 hearts&7 and &7Weakness for &e20s&7. Passive: &9Resistance III&7, &aStrength II&7, &dRegeneration II&7, &c+5 hearts&7."
      - "<prefix>&8• &7Receives &c50% less Heat Vision damage&7."
  bloodweaver_v_one:
    description:
      - "<prefix>&8• &3V One Upgrade&7 for Bloodweaver."
      - "<prefix>&8• &dF &8(Swap Item with Offhand)&7 fires &cBlood Lash&7 up to &e25 blocks&7 with &c2.5-5 hearts&7 damage."
      - "<prefix>&8• &dSneak + Left-Click&7 and keep sneaking for &e3s&7 to cast the stronger &cBlood Rupture&7."
      - "<prefix>&8• &7Blood Rupture roots and lifts targets for &e7s&7, dealing &c2 hearts/s&7 before throwing survivors back."
      - "<prefix>&8• &7Passive: &9Resistance III&7, &aStrength II&7, &dRegeneration II&7, &c+10 hearts&7 and &c50% Heat Vision reduction&7."
  spider_weaver:
    description:
      - "<prefix>&8• &7Style: like &fWebweaver&7."
      - "<prefix>&8• &dF &8(Swap Item with Offhand)&7 or &dSneak + Left-Click&7 shoots a web projectile. Cooldown: &e5s&7."
      - "<prefix>&8• &7Targets take damage, are slowed/fixed and larger cobweb clusters can stay up to &e1min&7."
      - "<prefix>&8• &7Can climb walls and takes no fall damage. Passive: &aStrength I&7, &9Resistance I&7 and &dRegeneration I&7."
  heal_angel:
    description:
      - "<prefix>&8• &7Style: like &fPrivate Angel&7. &3V One only&7."
      - "<prefix>&8• &7Passive boosts: &aStrength II&7, &9Resistance II&7, &dRegeneration II&7 and &c5 extra hearts&7."
      - "<prefix>&8• &dSneak + melee hit&7 heals the target for &a10% max health&7, at least &a1 heart&7, and deals no damage. Cooldown: &e1s&7."
      - "<prefix>&8• &dF &8(Swap Item with Offhand)&7 commands a targeted mob/animal to attack nearby targets except you for &e2min&7. Cooldown: &e30s&7."
  submarine:
    description:
      - "<prefix>&8• &7Style: like &bTorpedo&7. &3V One only&7."
      - "<prefix>&8• &7Passive: &aStrength II&7, &9Resistance II&7, Water Breathing, Dolphin's Grace and Conduit Power."
      - "<prefix>&8• &7In water: &aStrength V&7 and Regeneration."
      - "<prefix>&8• &dF &8(Swap Item with Offhand)&7 uses a double-strength dash with &e1s cooldown&7. &dSneak + Left-Click&7 toggles stronger sonar with &e65 blocks&7 range."
  the_detonator:
    description:
      - "<prefix>&8• &7Style: like &cNaqib&7."
      - "<prefix>&8• &dSneak + Left-Click&7 starts a cancellable countdown, then releases a huge self-centered explosion. Cooldown: &e10s&7."
      - "<prefix>&8• &7Passive: &aStrength II&7, &9Resistance I&7 and &6Fire Resistance&7."
      - "<prefix>&8• &7Melee hits burn targets. Every 3rd hit triggers a small explosive hit."
  the_veteran:
    description:
      - "<prefix>&8• &7Style: like &eSoldier Boy&7."
      - "<prefix>&8• &7High &aStrength&7, &9Resistance&7 and &6Fire Resistance&7."
      - "<prefix>&8• &dSneak + Left-Click&7: &e5s charge&7, then Chest Beam."
      - "<prefix>&8• &7Beam: high damage, block burn and player ability removal."
      - "<prefix>&8• &7Starts with a strong point-blank blast and mushroom cloud."

