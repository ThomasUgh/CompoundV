  drink_v_null: "<prefix>&2V-Null Virus&7 is spreading..."
  temp_v_extended: "<prefix>&aTemp V&7 was extended. Same ability, longer duration."
  compound_v_after_temp: "<prefix>&bCompound V&7 bonded with your temporary ability. A permanent Compound V ability will activate after Temp V expires."
