tutorial_book:
  title: "Compound V Guide"
  author: "Vought Lab"
  page_1:
    - "&1&lCompound V Guide"
    - ""
    - "&0All serums are crafted ONLY in the crafting grid."
    - "&0Always place exactly two items:"
    - "&8Source + Ingredient = Result"
    - "&8No specific shape required."
    - ""
    - "&0Brewing stand recipes are disabled/legacy."
  page_2:
    - "&b&lTemp V / Compound V Base"
    - ""
    - "1) Water Bottle + Nether Wart"
    - "= Awkward Potion"
    - "2) Awkward + Amethyst Shard"
    - "= Crystalline Serum"
    - "Crystalline + Echo Shard"
    - "= Resonant V Serum"
    - "Resonant + Glowstone Dust"
    - "= Activated V Serum"
  page_3:
    - "&a&lTemp V"
    - ""
    - "Activated V Serum + Sugar"
    - "= Unstable Temp V"
    - "Unstable Temp V + Redstone"
    - "= Temp V"
    - ""
    - "Temp V extends active Temp-V powers."
    - "5 doses in one life are lethal."
  page_4:
    - "&b&lCompound V"
    - ""
    - "Activated V Serum + Diamond"
    - "= Unstable V Serum"
    - "Unstable V Serum + Netherite Scrap"
    - "= Compound V"
    - ""
    - "Compound V is permanent until Anti V is used."
  page_5:
    - "&3&lV One"
    - ""
    - "Awkward + Dragon's Breath"
    - "= Draconic Serum"
    - "Draconic + Echo Shard"
    - "= Echo-Charged Serum"
    - "Echo-Charged + Netherite Scrap"
    - "= Reinforced Serum"
    - "Reinforced + Fermented Eye"
    - "= Unstable V-One Serum"
    - "Unstable V-One + Totem"
    - "= V One"
  page_6:
    - "&c&lAnti V / V-Null"
    - ""
    - "Anti V:"
    - "Awkward + Milk Bucket = Cleansing"
    - "Cleansing + Ghast Tear = Restorative"
    - "Restorative + Fermented Eye = Anti V"
    - ""
    - "V-Null:"
    - "Awkward + Wither Rose -> Decay"
    - "Decay -> Corrupted -> Resonant -> Airborne -> Stabilized -> V-Null"
  page_7:
    - "&6&lAbilities"
    - ""
    - "The Patriot: like Homelander"
    - "The Diver: like The Deep"
    - "The Runner: like A-Train"
    - "The Veteran: like Soldier Boy"
    - "Sonic Boom: like Bombsight"
    - ""
    - "Use /cv info for your active ability controls."
  page_8:
    - "&4&lSide Effects"
    - ""
    - "Temp V: Crash, Sickness, Muscle Failure, Internal Damage or Collapse."
    - "Compound V: rare minor side effects."
    - "V One: Heat Spike, Body Rejection, Instability."
    - ""
    - "Side effects can occur in addition to powers."
