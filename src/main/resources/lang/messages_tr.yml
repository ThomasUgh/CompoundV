      - "<prefix>&8• &7Düşme hasarı koruması, güçlü çift zıplama ve &e6+ bloktan&7 eğilerek inerken patlamalı iniş yapar."
  the_headpopper:
    description:
      - "<prefix>&8• &7Stil: Tıpkı &cVictoria Neuman&7 gibi."
      - "<prefix>&8• &dEğil + Sol Tık&7: &e30 blok&7 içindeki hedefi kilitler ve &c3sn&7 sonra kafasını patlatır."
      - "<prefix>&8• &7Hasar: Oyunculara &c12.5 kalp&7, yaratıklara &cx2.5&7. Bekleme Süresi: &e20sn&7."
      - "<prefix>&8• &dF &8(Elindeki Eşyayı Değiştirme tuşu)&7: Çevredeki tüm canlıların &cmevcut canının %25'ini&7 siler. Bekleme Süresi: &e2dk&7."
      - "<prefix>&8• &7Pasif Etkiler: &aGüç II&7, &9Dayanıklılık II&7, &dYenilenme I&7 ve Lazer Gözler bağışıklığı."
  bloodweaver:
    description:
      - "<prefix>&8• &7Stil: Tıpkı &cMarie Moreau&7 gibi."
      - "<prefix>&8• &dF &8(Elindeki Eşyayı Değiştirme tuşu)&7: En fazla &e25 blok&7 mesafeye &cKan Kırbacı&7 fırlatır. Bekleme Süresi: &e3sn&7."
      - "<prefix>&8• &7Kan Kırbacı &c2-4 kalp&7 hasar verir, hedefi yavaşlatır ve &e3sn&7 kanatır."
      - "<prefix>&8• &7Her &eüçüncü yakın dövüş vuruşu&7 saniyede &c0.5 kalp&7 hasarla &e2sn&7 kanama uygular."
      - "<prefix>&8• &dEğil + Sol Tık&7 basılı tut ve &e3sn&7 boyunca eğilerek &e15 blok&7 alanda &cKan Patlaması&7 tetikle."
      - "<prefix>&8• &7Kan Patlaması hedefleri &e3 blok&7 havaya kaldırır, &e5sn&7 sabitler ve saniyede &c2 kalp&7 hasar verir."
      - "<prefix>&8• &7Bedeli: Kendi canından &c2 kalp&7 ve &e20sn&7 boyunca &7Zayıflık&7. Pasif: &9Dayanıklılık III&7, &aGüç II&7, &dYenilenme II&7, &c+5 Can&7."
      - "<prefix>&8• &7Lazer Gözlerden (Heat Vision) &c%50 daha az hasar&7 alır."
  bloodweaver_v_one:
    description:
      - "<prefix>&8• &3V One Yükseltmesi&7. Pasif: &9Dayanıklılık III&7, &aGüç II&7, &dYenilenme II&7, &c+10 Can&7."
      - "<prefix>&8• &dF &8(Elindeki Eşyayı Değiştirme tuşu)&7: &c2.5-5 kalp&7 hasarla &cKan Kırbacı&7 fırlatır."
      - "<prefix>&8• &dEğil + Sol Tık&7 basılı tut ve &e3sn&7 eğilerek daha güçlü olan &cKan Patlamasını&7 tetikle."
      - "<prefix>&8• &7Kan Patlaması hedefleri &e7sn&7 boyunca kaldırıp sabitler ve saniyede &c2 kalp&7 hasar verir."
  spider_weaver:
    description:
      - "<prefix>&8• &7Stil: Tıpkı &fWebweaver&7 gibi."
      - "<prefix>&8• &dF &8(Elindeki Eşyayı Değiştirme tuşu)&7 veya &dEğil + Sol Tık&7 ile ağ fırlatır. Bekleme Süresi: &e5sn&7."
      - "<prefix>&8• &7Ağ atışları hasar verir, hedefleri yavaşlatır/sabitler. Ağ blokları yerde &e1dk&7 kalabilir."
      - "<prefix>&8• &7Duvarlara tırmanabilir ve düşme hasarı almaz. Pasif: &aGüç I&7, &9Dayanıklılık I&7 ve &dYenilenme I&7."
  heal_angel:
    description:
      - "<prefix>&8• &7Stil: Tıpkı &fPrivate Angel&7 gibi. &3Sadece V One&7."
      - "<prefix>&8• &7Pasif Etkiler: &aGüç II&7, &9Dayanıklılık II&7, &dYenilenme II&7 ve &c+5 Ekstra Can&7."
      - "<prefix>&8• &dEğil + Yakın Dövüş Vuruşu&7: Hedefi maksimum canının &a%10'u&7 kadar iyileştirir (en az &a1 kalp&7) ve hasar vermez. Bekleme Süresi: &e1sn&7."
      - "<prefix>&8• &dF &8(Elindeki Eşyayı Değiştirme tuşu)&7: Hedeflenen yaratığı/hayvanı &e2dk&7 boyunca etraftakilere saldırtır. Bekleme Süresi: &e30sn&7."
  submarine:
    description:
      - "<prefix>&8• &7Stil: Tıpkı &bTorpedo&7 gibi. &3Sadece V One&7."
      - "<prefix>&8• &7Pasif Etkiler: Suda Nefes Alma, Yunusun Lütfu ve Kanal Gücü etkileri kalıcıdır."
      - "<prefix>&8• &7Suyun içindeyken &aGüç V&7 ve Yenilenme etkilerini alır."
      - "<prefix>&8• &dF &8(Elindeki Eşyayı Değiştirme tuşu)&7: Suda &e1sn bekleme süresiyle&7 iki kat daha güçlü girdap atılışı yapar."
      - "<prefix>&8• &dEğil + Sol Tık&7: &e65 blok&7 menzilli daha güçlü sualtı sonarını açıp kapatır."
  the_detonator:
    description:
      - "<prefix>&8• &7Stil: Tıpkı &cNaqib&7 gibi."
      - "<prefix>&8• &dEğil + Sol Tık&7: Geri sayımdan sonra merkezinde kendi vücudunun olduğu devasa bir patlama yapar. Bekleme Süresi: &e10sn&7."
      - "<prefix>&8• &7Pasif Etkiler: &aGüç II&7, &9Dayanıklılık I&7 and &6Ateş Direnci&7."
      - "<prefix>&8• &7Vuruşlar rakipleri yakar. Her 3. yakın dövüş vuruşu küçük bir patlama tetikler."
  the_veteran:
    description:
      - "<prefix>&8• &7Stil: Tıpkı &eSoldier Boy&7 gibi."
      - "<prefix>&8• &7Kalıcı olarak çok güçlü &aGüç&7, &9Dayanıklılık&7 and &6Ateş Direnci&7 etkileri sağlar."
      - "<prefix>&8• &dEğil + Sol Tık&7: &e5sn şarj&7 ettikten sonra göğsünden radyoaktif enerji ışını fırlatır."
      - "<prefix>&8• &7Göğüs Işını: Çok yüksek hasar verir, blokları yakar ve oyuncuların süper güçlerini ellerinden alır."
      - "<prefix>&8• &7Büyük bir nükleer patlama ve mantar bulutu oluşturarak başlar."

