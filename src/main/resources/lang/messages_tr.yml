      - "<prefix>&8• &7Buzları ve kar katmanlarını eritebilir, çiğ yiyecekleri anında pişirebilir."
  ice_cube:
    description:
      - "<prefix>&8• &bBuzda Yürüyüş&7: Hareket ederken altındaki su kütleleri donar."
      - "<prefix>&8• &bBuz Kayışı&7: Her zemin kaygandır; buz üstünde &eHız II&7 alırsın."
      - "<prefix>&8• &bBuz Dikeni&7: Hedefe buz dikeni fırlatmak için &dF &8(Elindeki Eşyayı Değiştirme tuşu)&7 bas. Bekleme Süresi: &e3sn&7."
      - "<prefix>&8• &7Buz dikenleri hedefi &b5sn&7 boyunca &bYavaşlık III&7 ve &710sn&7 boyunca &7Zayıflık II&7 yapar."
      - "<prefix>&8• &7Yakın dövüş vuruşları hedefi &b5sn&7 boyunca &bYavaşlık I&7 yapar."
      - "<prefix>&8• &bBuz Duvarı&7: &dEğil + Sol Tık&7 ile &e4 blok&7 önüne geçici bir buz barikatı kur. Bekleme Süresi: &e60sn&7."
      - "<prefix>&8• &7Pasif Etkiler: &aGüç I&7 ve &9Dayanıklılık I&7."
  the_diver:
    description:
      - "<prefix>&8• &7Stil: Tıpkı &bThe Deep&7 gibi."
      - "<prefix>&8• &bSuda Nefes Alma&7, &bYunusun Lütfu VIII&7, &esualtında yüksek hız&7 ve &3Kanal Gücü II&7 kalıcı olarak aktiftir."
      - "<prefix>&8• &bSonar&7: Suyun altındayken yakındaki canlıları taramak için &dEğil + Havaya Sol Tık&7."
      - "<prefix>&8• &bGirdap Atılışı&7: Suda veya yağmurda &dF &8(Elindeki Eşyayı Değiştirme tuşu)&7 basarak üç çatallı mızraksız fırla."
