  stormstrike:
    description:
      - "<prefix>&8• &7Stil: Tıpkı &eStormfront&7 gibi. &3Sadece V One&7 ile alınabilir. Elektrikli kalkış ve &e2.75x&7 uçuş hızı."
      - "<prefix>&8• &dF &8(Elindeki Eşyayı Değiştirme tuşu)&7: En fazla &e6sn&7 boyunca 35 blokluk elektrik ışını atar. Hasar: &c2.55 kalp&7 ve Yavaşlık."
