language_file_version: 29
prefix: "&8[&b&lCV&r&8] "

general:
  no_permission: "<prefix>&cBuna yetkin yok, ezik! Vought kuralları geçerli."
  player_not_found: "<prefix>&cHedef oyuncu bulunamadı. Muhtemelen ortadan kaldırıldı."
  reloaded: "<prefix>&aCompoundV başarıyla yeniden yüklendi. Vought laboratuvarları güncellendi."
  not_a_player: "<prefix>&cBu komut sadece sahada aktif olan Süperler (oyuncular) tarafından kullanılabilir."
  only_players: "<prefix>&cBu komut sadece Süperler tarafından kullanılabilir."

potion:
  drinking: "<prefix>&7&bSerum&7 enjekte ediliyor... Damarlarındaki gücü hisset!"
  drink_temp_v: "<prefix>&aTemp V&7 aktifleşiyor. Unutma, bu güç sadece geçici bir süre seninle olacak. Tadını çıkar!"
  drink_v_one: "<prefix>&3V One&7 sistemi ele geçiriyor. Kendine mukayyet ol, bu doz oldukça sert!"
  drink_anti_v: "<prefix>&cAnti V&7 sistemini temizliyor. Süper güçlerin elinden alınıyor."
  no_ability: "<prefix>&7Damarlarında aktif bir güç yok. Henüz sıradan bir 'insansın'."
  milk_blocked: "<prefix>&cSüt içmek Compound V güçlerini silemez! Vought teknolojisini hafife alma. Anti V veya V-Null kullan."
  no_chances: "<prefix>&cBu serumda kullanılabilir bir genetik kod yok. Vought laboratuvarına bildirin."
  roll_failed: "<prefix>&cSerum vücuduna uyum sağlayamadı. Bir adminle iletişime geç."

  drink_v_null: "<prefix>&2V-Null Virüsü&7 yayılıyor... Güçlerini kaybetmeye hazır ol!"
  temp_v_extended: "<prefix>&aTemp V&7 süresi uzatıldı. Aynı yetenek, daha uzun ve vahşi bir deneyim!"
  compound_v_after_temp: "<prefix>&bCompound V&7 geçici yeteneğinle kalıcı olarak bağlandı. Temp V sona erdiğinde kalıcı gücün uyanacak."
  compound_v_delayed_granted: "<prefix>&bCompound V&7 artık hücrelerine tamamen işledi ve kalıcı hale geldi."
  temp_v_blocked_by_compound: "<prefix>&aTemp V&7 kalıcı Compound V gücünü bastıramaz. Sadece hafif yan etkiler hissettin."
  no_effect_compound_active: "<prefix>&7Kalıcı gücün varken yeni bir Compound V enjekte edemezsin. Önce &cAnti V&7 ile temizlen."
  no_effect_v_one_active: "<prefix>&7V One sistemin yeni bir doz almayı reddediyor. Hiçbir şey değişmedi."
  v_one_upgrade: "<prefix>&3V One&7 mevcut yeteneğini bir üst seviyeye yükseltti!"
  v_one_no_upgrade: "<prefix>&7V One bu yetenekle bir reaksiyona girmedi."

  only_drinkable: "<prefix>&cCompound V serumları sadece normal içilebilir iksir olarak kullanılabilir. V-Null Virüsü ise fırlatılabilir."

ability:
  granted_header: "<prefix>&8━━━━━━━━ &aYetenek Kilidi Açıldı &8━━━━━━━━"
  granted_name: "<prefix>&7Vought, &b{potion}&7 kullanarak &a&l{name}&r&7 gücünü açığa çıkardı."
  controls_header: "<prefix>&8────── &aKontroller & Etkiler &8──────"
  granted_expires: "<prefix>&8• &7Kalan Süre: &e{minutes}dk {seconds}sn"
  granted_tip: "<prefix>&8• &7Gücünün detaylarını ve kontrollerini görmek için istediğin zaman &f/cv stats&7 yaz."
  granted_footer: "<prefix>&8━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

  lost_on_death: "<prefix>&cÖldün ve tüm süper güçlerin yok oldu. Sıradan bir cesetsin artık."
  expired: "<prefix>&eGeçici yeteneğinin süresi doldu. Güçlerin geri çekiliyor."
  removed_admin: "<prefix>&cGüçlerin üst düzey bir Vought yetkilisi tarafından geri alındı."
  removed_anti_v: "<prefix>&cAnti V serumu hücrelerindeki süper genleri yok etti."

  the_patriot:
    description:
      - "<prefix>&8• &7Stil: Tıpkı &cHomelander&7 gibi."
      - "<prefix>&8• &aUçuş&7 otomatik olarak kalıcı aktiftir."
      - "<prefix>&8• &cLazer Gözler&7: Açıp kapatmak için &dF &8(Elindeki Eşyayı Değiştirme tuşu)&7 bas. Hasar: &e5 kalp&7, Menzil: &e44 blok&7."
      - "<prefix>&8• &bX-Ray&7: Yakındaki canlıları görmek için &dEğil + Havaya Sol Tık&7."
      - "<prefix>&8• &6Dikey Fırlayış&7: Yukarı fırlamak için &dEğil&7, gökyüzüne bak ve zıpla."
      - "<prefix>&8• &cHızlı Atılış&7: &dEğil + Farenin Tekerleğini Kaydır&7 ile &e25 blok&7 ileri fırla."
      - "<prefix>&8• &cİleri Atılış&7: &dEğil + Zıpla + İleri Yürü&7 ile düz 10-15 blok ileri sıçra."
      - "<prefix>&8• &7Pasif Etkiler: &aGüç&7, &9Dayanıklılık&7, &dYenilenme&7 ve &cEkstra Can&7."
  the_patriot_v_one:
