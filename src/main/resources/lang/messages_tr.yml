      - "<prefix>&8• &aUçuş&7 daha güçlü V One takviyeleriyle otomatik olarak aktiftir."
      - "<prefix>&8• &cLazer Gözler&7: Açıp kapatmak için &dF &8(Elindeki Eşyayı Değiştirme tuşu)&7 bas. Hasar: &e4.725 kalp&7, Menzil: &e50 blok&7."
      - "<prefix>&8• &bX-Ray&7: Yakındaki canlıları görmek için &dEğil + Havaya Sol Tık&7."
      - "<prefix>&8• &6Dikey Fırlayış&7: Yukarı fırlamak için &dEğil&7, gökyüzüne bak ve zıpla."
      - "<prefix>&8• &cHızlı Atılış&7: &dEğil + Farenin Tekerleğini Kaydır&7 ile &e25 blok&7 ileri fırla."
      - "<prefix>&8• &cİleri Atılış&7: &dEğil + Zıpla + İleri Yürü&7 ile düz 10-15 blok ileri sıçra."
      - "<prefix>&8• &7Pasif Etkiler: &aGüç&7, &9Dayanıklılık&7, &dYenilenme&7, &6Ateş Direnci&7 ve &cEkstra Can&7."
  sonic_boom:
    description:
      - "<prefix>&8• &7Stil: Tıpkı &3Bombsight&7 gibi."
      - "<prefix>&8• &aUçuş&7 otomatik olarak aktiftir."
      - "<prefix>&8• &6Dikey Fırlayış&7: &dEğil&7, yukarı bak ve zıpla. Uçuştan güçlü, Patriot'tan biraz daha zayıftır."
      - "<prefix>&8• &3Sonik Işın&7: &dEğil + Sol Tık&7 ile hedefe sonik dalga fırlat. Bekleme Süresi: &e3sn&7."
      - "<prefix>&8• &cPatlamalı Yumruk&7: Her 2. vuruş küçük bir patlama tetikler; kritik vuruşlar daha ölümcüldür."
      - "<prefix>&8• &cPatlamalı İniş&7: Yüksekten düşerken yere inerken &dEğil&7. Bekleme Süresi: &e60sn&7."
      - "<prefix>&8• &7Pasif Etkiler: &aGüç IV&7 ve &9Dayanıklılık IV&7."
  size_changer:
    description:
      - "<prefix>&8• &7Pasif Etkiler: &aGüç I&7 ve &9Dayanıklılık I&7."
      - "<prefix>&8• &dEğil + Sol Tık + Yukarı Bak&7: Hasar bonuslu &52x daha büyük&7 bir deve dönüş (En fazla &e1dk&7)."
      - "<prefix>&8• &dEğil + Sol Tık + Aşağı Bak&7: Hücrelerini küçülterek &53.5x daha küçük&7 ol (En fazla &e2dk&7)."
      - "<prefix>&8• &7Dönüşmüşken &dEğil + Sol Tık + Yukarı/Aşağı Bak&7 seni anında normal boyutuna döndürür."
