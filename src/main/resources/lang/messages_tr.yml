      - "<prefix>&8• &7Eğilerek Yere İniş: 10 blok çapında bir alana &e6 adet yıldırım&7 indirir. Bekleme Süresi: &e100sn&7."
      - "<prefix>&8• &7Pasif Etkiler: &aGüç III&7, &9Dayanıklılık III&7 ve &c+10 Ekstra Can&7."
  fire_sonic:
    description:
      - "<prefix>&8• &cAlev Aurası&7: Her yakın dövüş vuruşu hedefi ağır şekilde yakar."
      - "<prefix>&8• &dF &8(Elindeki Eşyayı Değiştirme tuşu)&7: En fazla &e2sn&7 süren alev ışını atar. Hasar hızı lazer gözlere yakındır."
  toxic_cloud:
    description:
      - "<prefix>&8• &7Pasif Etkiler: &aGüç I&7 ve &9Dayanıklılık I&7. Zehirlenmeye karşı tamamen bağışıksın."
      - "<prefix>&8• &dF &8(Elindeki Eşyayı Değiştirme tuşu)&7: Önüne &2Zehir IV&7 uygulayan zehirli gaz bulutu salar. Bekleme Süresi: &e2dk&7."
      - "<prefix>&8• &dEğil + Sol Tık&7: &c1.5 kalp&7 hasar veren ve &2Zehir IV&7 uygulayan zehir kusmuğu atar."
  the_countess:
    description:
      - "<prefix>&8• &7Stil: Tıpkı &cCrimson Countess&7 gibi."
      - "<prefix>&8• &dF &8(Elindeki Eşyayı Değiştirme tuşu)&7: Patlayıcı alev topu fırlatır. Hasar: &c2-4 kalp&7. Bekleme Süresi: &e5sn&7."
