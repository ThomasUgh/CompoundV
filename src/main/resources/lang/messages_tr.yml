  size_changer_v_one:
    description:
      - "<prefix>&8• &3V One Yükseltmesi&7. Pasif: &aGüç I&7 ve &9Dayanıklılık I&7."
      - "<prefix>&8• &dEğil + Sol Tık + Yukarı Bak&7: V One hasar bonusuyla &53x daha büyük&7 bir deve dönüş."
      - "<prefix>&8• &dEğil + Sol Tık + Aşağı Bak&7: Hücrelerini tamamen sıkıştırarak &57x daha küçük&7 ol."
      - "<prefix>&8• &7Sadece aktif bir Boyut Değiştiriciyi &3V One&7 ile yükselterek elde edebilirsin."
  heat_vision:
