language_file_version: 22
prefix: '&8[&b&lCV&r&8] '
general:
  no_permission: <prefix>&cУ вас нет прав для этого действия.
  player_not_found: <prefix>&cИгрок не найден.
  reloaded: <prefix>&aCompoundV перезагружен.
  not_a_player: <prefix>&cЭту команду могут использовать только игроки.
  only_players: <prefix>&cЭту команду могут использовать только игроки.
potion:
  drinking: <prefix>&7&bСыворотка&7 активируется...
  drink_temp_v: <prefix>&aTemp V&7 активируется. Способность будет действовать ограниченное время.
  drink_v_one: <prefix>&3V One&7 активируется. Приготовьтесь.
  drink_anti_v: <prefix>&cAnti V&7 удаляет вашу активную способность.
  no_ability: <prefix>&7У вас нет активной способности.
  no_chances: <prefix>&cДля этого зелья не настроены допустимые способности. Обратитесь к администратору.
  roll_failed: <prefix>&cСыворотку не удалось обработать. Обратитесь к администратору.
  drink_v_null: <prefix>&2V-Null Virus&7 распространяется...
  temp_v_extended: <prefix>&aTemp V&7 продлён. Та же способность, больше длительность.
  compound_v_after_temp: <prefix>&bCompound V&7 связался с вашей временной способностью. Постоянная способность Compound V активируется после окончания Temp V.
  compound_v_delayed_granted: <prefix>&bCompound V&7 теперь активирован постоянно.
  temp_v_blocked_by_compound: <prefix>&aTemp V&7 не может заменить постоянный Compound V. Возникли только слабые побочные эффекты.
  no_effect_compound_active: <prefix>&7Compound V не действует, пока у вас уже есть постоянная способность. Сначала используйте &cAnti V&7.
  no_effect_v_one_active: <prefix>&7Ваша система V One отвергает дополнительный V. Ничего не происходит.
  v_one_upgrade: <prefix>&3V One&7 усилил вашу текущую способность.
  v_one_no_upgrade: <prefix>&7V One пока не реагирует с этой способностью.
  only_drinkable: <prefix>&cСыворотки Compound V можно использовать только как обычные питьевые зелья. V-Null Virus можно бросать.
  milk_blocked: <prefix>&cMilk cannot remove Compound V powers. Use Anti V or V-Null mechanics instead.
ability:
  granted_header: <prefix>&8━━━━━━━━ &aСпособность открыта &8━━━━━━━━
  granted_name: <prefix>&7Вы открыли &a&l{name}&r&7 через &b{potion}&7.
  controls_header: <prefix>&8────── &aУправление и эффекты &8──────
  granted_expires: '<prefix>&8• &7Длительность: &e{minutes}m {seconds}s'
  granted_footer: <prefix>&8━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  lost_on_death: <prefix>&cВы потеряли способность при смерти.
  expired: <prefix>&eВаша временная способность истекла.
  removed_admin: <prefix>&cАдминистратор удалил вашу способность.
  removed_anti_v: <prefix>&cAnti V удалил вашу способность.
  the_patriot:
    description:
    - '<prefix>&8• &7Стиль: как &cHomelander&7.'
    - <prefix>&8• &aПолёт&7 включён автоматически.
    - '<prefix>&8• &cТепловое зрение&7: нажмите &dF &8(Swap Item with Offhand)&7 для переключения. По умолчанию: &e5 сердец&7, &e44 блоков&7.'
    - '<prefix>&8• &bрентген&7: &dШифт + ЛКМ в воздух&7 чтобы показать ближайших сущностей.'
    - '<prefix>&8• &6старт прыжка&7: &dШифт&7, смотрите вверх и прыгните для запуска.'
    - '<prefix>&8• &7Пассивные усиления: &aСила&7, &9Сопротивление&7, &dРегенерация&7 и &cбонусные сердца&7.'
  the_patriot_v_one:
    description:
    - '<prefix>&8• &7Стиль: как &cHomelander&7.'
    - <prefix>&8• &aПолёт&7 включён автоматически с более сильными усилениями V One.
    - '<prefix>&8• &cТепловое зрение&7: нажмите &dF &8(Swap Item with Offhand)&7 для переключения. По умолчанию: &e4.725 сердец&7, &e50 блоков&7.'
    - '<prefix>&8• &bрентген&7: &dШифт + ЛКМ в воздух&7 чтобы показать ближайших сущностей.'
    - '<prefix>&8• &6старт прыжка&7: &dШифт&7, смотрите вверх и прыгните для запуска.'
    - '<prefix>&8• &7Пассивные усиления: &aСила&7, &9Сопротивление&7, &dРегенерация&7, &6Огнестойкость&7 и &cбонусные сердца&7.'
  sonic_boom:
    description:
    - '<prefix>&8• &7Стиль: как &3Bombsight&7.'
    - <prefix>&8• &aПолёт&7 включён автоматически.
    - '<prefix>&8• &6старт прыжка&7: &dШифт&7, смотрите вверх и прыгните. Stronger than Полёт, slightly weaker than Patriot.'
    - '<prefix>&8• &3Звуковой луч&7: &dШифт + ЛКМ&7 чтобы выстрелить a звуковой луч как у Warden. Перезарядка: &e3s&7.'
    - '<prefix>&8• &cВзрывной ближний бой&7: каждый 2nd удар adds a small blast; crits удар harder.'
    - '<prefix>&8• &cВзрывное приземление&7: &dШифт&7 when landing после a high fall. Перезарядка: &e60s&7.'
    - '<prefix>&8• &7Пассивные усиления: &aСила IV&7 и &9Сопротивление IV&7.'
  size_changer:
    description:
    - '<prefix>&8• &7Пассивные усиления: &aСила II&7 и &9Сопротивление II&7.'
    - '<prefix>&8• &dШифт + ЛКМ + смотрите вверх&7: стать &52x больше&7, двойной урон, &aJump Boost II&7 и &c+10 сердец&7 for max &e1min&7.'
    - '<prefix>&8• &dШифт + ЛКМ + смотрите вниз&7: стать &53.5x меньше&7 for max &e2min&7.'
    - <prefix>&8• &7While transformed, &dШифт + ЛКМ + смотрите вверх/down&7 returns you to normal instantly.
    - <prefix>&8• &7Перезарядка начинается после возврата к норме.
  size_changer_v_one:
    description:
    - '<prefix>&8• &3V One Upgrade&7 for SizeChanger. Passive: &aСила III&7 и &9Сопротивление II&7.'
    - '<prefix>&8• &dШифт + ЛКМ + смотрите вверх&7: примерно &53x больше&7, больше урона, &aJump Boost IV&7 и &c+20 сердец&7.'
    - '<prefix>&8• &dШифт + ЛКМ + смотрите вниз&7: примерно &57x меньше&7.'
    - <prefix>&8• &7Доступно только при улучшении активного SizeChanger через &3V One&7.
  heat_vision:
    description:
    - '<prefix>&8• &bТепловое зрение&7: нажмите &dF &8(Swap Item with Offhand)&7 для переключения the beam.'
    - '<prefix>&8• &7Stages: &bI&7 = 1.35 сердец / 30 блоков, &aII&7 = 2 сердец / 35 блоков.'
    - '<prefix>&8• &7More stages: &6III&7 = 2.25 сердец / 37 блоков, &cIV&7 = 2.7 сердец / 40 блоков.'
    - <prefix>&8• &7Can melt ice, snow блоков, flat snow layers, и cook raw mob drops.
  the_diver:
    description:
    - '<prefix>&8• &7Стиль: как &bThe Deep&7.'
    - <prefix>&8• &bWater Breathing&7, &bDolphin's Grace VIII&7, &eSpeed пока под водой&7 и &3Conduit Power II&7 are active постоянно.
    - '<prefix>&8• &bсонар&7: &dШифт + ЛКМ в воздух&7 пока под водой чтобы показать ближайших сущностей.'
    - '<prefix>&8• &bRiptide рывок&7: &dШифт + ПКМ&7 in вода или дождь, similar to Riptide IV без holding a trident.'
    - '<prefix>&8• &7Пассивные усиления: &aСила II&7 и &9Сопротивление I&7.'
    - <prefix>&8• &7While под водой, Сила и Сопротивление are increased by &a+1 level&7.
  jumper:
    description:
    - <prefix>&8• &aСила I&7 is active постоянно.
    - '<prefix>&8• &aрывок прыжка&7: нажмите &dF &8(Swap Item with Offhand)&7 for &aJump Boost V&7 и no урон от падения пока active.'
    - '<prefix>&8• &7Default active time: &e10s&7. Перезарядка: &e15s&7.'
  shockwave:
    description:
    - '<prefix>&8• &7Пассивные усиления: &aСила II&7 и &9Сопротивление I&7.'
    - '<prefix>&8• &eShockwave&7: нажмите &dF &8(Swap Item with Offhand)&7 чтобы выпустить a 10-block knockback wave.'
    - '<prefix>&8• &7Урон: &c3 сердец&7 to игроки, &c6 сердец&7 to мобы. Перезарядка: &e2min&7.'
  vision:
    description:
    - '<prefix>&8• &bрентген&7: &dШифт + ЛКМ в воздух&7 чтобы показать ближайших сущностей.'
    - '<prefix>&8• &7Default range: &e35 блоков&7.'
  the_runner:
    description:
    - '<prefix>&8• &7Стиль: как &eA-Tдождь&7.'
    - '<prefix>&8• &eRunner Speed&7: нажмите &dF &8(Swap Item with Offhand)&7 для переключения Speed X, XI, XII, XV и off.'
    - '<prefix>&8• &eImpact Run&7: running через entities at Speed X+ deals &c6 сердец&7, plus &c+1 heart&7 per extra speed level.'
    - '<prefix>&8• &7Пассивные усиления: &aСила II&7, &9Сопротивление I&7, &c5 extra сердец&7 и без перезарядки ближнего боя.'
  teleporter:
    description:
    - '<prefix>&8• &5блинк&7: нажмите &dF &8(Swap Item with Offhand)&7 чтобы телепортироваться up to &e35 блоков&7.'
    - '<prefix>&8• &7Перезарядка: &e2 seconds&7. Includes &aСила I&7 и &9Сопротивление I&7.'
  teleporter_v_one:
    description:
    - <prefix>&8• &3V One Upgrade&7 for Teleporter.
    - '<prefix>&8• &5блинк&7: нажмите &dF &8(Swap Item with Offhand)&7 чтобы телепортироваться up to &e50 блоков&7.'
    - '<prefix>&8• &7Пассивные усиления: &aСила II&7 и &9Сопротивление III&7.'
  fly:
    description:
    - <prefix>&8• &aПолёт&7 включён автоматически.
    - '<prefix>&8• &6Light старт прыжка&7: &dШифт&7, смотрите вверх и прыгните for a weaker launch.'
    - <prefix>&8• &7Includes &aСила I&7 и &9Сопротивление I&7.
  speedster:
    description:
    - '<prefix>&8• &eSuper Speed&7: нажмите &dF &8(Swap Item with Offhand)&7 для переключения it on/off.'
    - <prefix>&8• &7Includes a small &9Сопротивление&7 bonus пока active.
  strength:
    description:
    - <prefix>&8• &aСила&7 is active постоянно пока you own this способность.
    - <prefix>&8• &7Includes a small &9Сопротивление&7 bonus.
  the_ghost:
    description:
    - '<prefix>&8• &5Ghost Mode&7: нажмите &dF &8(Swap Item with Offhand)&7 для переключения invisibility.'
    - <prefix>&8• &7When включено you receive &5Invisibility II&7 и мобы will not цель you.
    - <prefix>&8• &7Existing mob цельs are cleared пока Ghost Mode is active.
    - '<prefix>&8• &7Пассивные усиления: &9Сопротивление II&7, &aСила I&7 и &6Огнестойкость&7.'
    - <prefix>&8• &7Тепловое зрение deals no damage to The Ghost.
  fire:
    description:
    - <prefix>&8• &cFire Aura&7 ignites nearby enemies automatically.
    - <prefix>&8• &6Огнестойкость&7 is включено.
    - <prefix>&8• &7Includes &aСила I&7 и &9Сопротивление I&7.
    - <prefix>&8• &7Vanilla right-click fire placement с &6Flint и Steel&7 или &6Fire Charges&7 is blocked пока you own this способность.
  the_worm:
    description:
    - <prefix>&8• &7Very fast digging с &eHaste IV&7, focused on dirt, grass, gravel и sand gameplay.
    - <prefix>&8• &dF &8(Swap Item with Offhand)&7 toggles &bNight Vision&7.
    - '<prefix>&8• &7Пассивные усиления: &aСила I&7 и &9Сопротивление I&7.'
  flash_light:
    description:
    - '<prefix>&8• &7Стиль: как &eStarlight&7. Passive: &aСила II&7 и &9Сопротивление I&7.'
    - '<prefix>&8• &dF &8(Swap Item with Offhand)&7 blinds игроки, мобы и животные in &e15 блоков&7 for &e20s&7. Перезарядка: &e2min&7.'
    - <prefix>&8• &dШифт + ЛКМ&7 fires a 15-block light beam с &c2 сердец&7, tiny горение и knockback.
  stormstrike:
    description:
    - '<prefix>&8• &7Стиль: как &eStormfront&7. &3V One только&7 с electric прыгните start и &e2.75x&7 fly speed.'
    - '<prefix>&8• &dF &8(Swap Item with Offhand)&7 fires a jagged 35-block lightning beam for max &e6s&7. Урон: &c3 сердец&7 и Slowness. Only overheats после full use.'
    - <prefix>&8• &dШифт + ЛКМ&7 summons &e4 lightning strikes&7. Every 5th melee удар calls a lightning strike.
    - '<prefix>&8• &7Шифт fall impact: 6 lightning strikes in a 10-block radius. Перезарядка: &e100s&7.'
    - '<prefix>&8• &7Пассивные усиления: &aСила III&7, &9Сопротивление III&7 и &c10 extra сердец&7.'
  fire_sonic:
    description:
    - '<prefix>&8• &cFlame Aura&7: каждый melee удар applies heavy горение.'
    - <prefix>&8• &dF &8(Swap Item with Offhand)&7 fires a thin flame beam for max &e2s&7. Damage ticks are slower than Тепловое зрение и только overheat после full use.
  toxic_cloud:
    description:
    - '<prefix>&8• &7Пассивные усиления: &aСила I&7 и &9Сопротивление I&7. Immune to яд.'
    - '<prefix>&8• &dF &8(Swap Item with Offhand)&7 releases яд gas in front of you, applying &2Яд IV&7. Перезарядка: &e2min&7.'
    - <prefix>&8• &dШифт + ЛКМ&7 shoots short яд vomit for &c1.5 сердец&7 и &2Яд IV&7. Melee ударs apply short Яд I.
  the_countess:
    description:
    - '<prefix>&8• &7Стиль: как &cCrimson Countess&7.'
    - '<prefix>&8• &dF &8(Swap Item with Offhand)&7 launches a fireball. Перезарядка: &e3s&7. Урон: &c2-4 сердец&7.'
    - <prefix>&8• &7Double-прыгните с small fire animation. Melee ударs apply горение.
    - '<prefix>&8• &7Пассивные усиления: &aСила II&7, &9Сопротивление I&7 и &6Огнестойкость&7.'
  the_warrior:
    description:
    - '<prefix>&8• &7Стиль: как &eQueen Maeve&7.'
    - '<prefix>&8• &7Пассивные усиления: &aСила III&7, &9Сопротивление II&7, &dРегенерация I&7 и &c10 extra сердец&7.'
    - <prefix>&8• &7High fall protection, strong double-прыгните и small explosive landing from &e6+ блоков&7 только пока sneaking.
  the_headpopper:
