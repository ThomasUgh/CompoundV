    - <prefix>&8• &dШифт + ЛКМ&7 marks a цель up to &e30 блоков&7 for a &c3s&7 обратный отсчёт.
    - '<prefix>&8• &7Урон: &c12.5 сердец&7, мобы/животные take &cx2.5&7. Перезарядка: &e20s&7.'
    - '<prefix>&8• &dF &8(Swap Item with Offhand)&7 damages all nearby living цельs for &c25% current лечениеth&7. Перезарядка: &e2min&7.'
    - '<prefix>&8• &7Пассивные усиления: &aСила II&7, &9Сопротивление II&7, &dРегенерация I&7 и Тепловое зрение immunity.'
  spider_weaver:
    description:
    - '<prefix>&8• &7Стиль: как &fWebweaver&7.'
    - '<prefix>&8• &dF &8(Swap Item with Offhand)&7 или &dШифт + ЛКМ&7 shoots a web projectile. Перезарядка: &e3s&7.'
    - <prefix>&8• &7Targets take damage, are slowed/fixed и larger cobweb clusters can stay up to &e1min&7.
    - '<prefix>&8• &7Can climb walls и takes no урон от падения. Passive: &aСила I&7, &9Сопротивление I&7 и &dРегенерация I&7.'
  heal_angel:
    description:
    - '<prefix>&8• &7Стиль: как &fPrivate Angel&7. &3V One только&7.'
    - '<prefix>&8• &7Пассивные усиления: &aСила II&7, &9Сопротивление II&7, &dРегенерация II&7 и &c5 extra сердец&7.'
    - '<prefix>&8• &dШифт + melee удар&7 лечит the цель for &a10% max лечениеth&7, at least &a1 heart&7, и deals no damage. Перезарядка: &e1s&7.'
    - '<prefix>&8• &dF &8(Swap Item with Offhand)&7 командаs a цельed mob/animal to attack nearby цельs except you for &e2min&7. Перезарядка: &e30s&7.'
  submarine:
    description:
    - '<prefix>&8• &7Стиль: как &bTorpedo&7. &3V One только&7.'
    - '<prefix>&8• &7Passive: &aСила II&7, &9Сопротивление II&7, Water Breathing, Dolphin''s Grace и Conduit Power.'
    - '<prefix>&8• &7In вода: &aСила V&7 и Регенерация.'
    - <prefix>&8• &dF &8(Swap Item with Offhand)&7 uses a double-strength dash с &e1s cooldown&7. &dШифт + ЛКМ&7 toggles stronger sonar с &e65 блоков&7 range.
  the_detonator:
    description:
    - '<prefix>&8• &7Стиль: как &cNaqib&7.'
    - '<prefix>&8• &dШифт + ЛКМ&7 starts a cancellable обратный отсчёт, then releases a huge self-centered explosion. Перезарядка: &e10s&7.'
    - '<prefix>&8• &7Passive: &aСила II&7, &9Сопротивление I&7 и &6Огнестойкость&7.'
    - <prefix>&8• &7Melee ударs горение цельs. Every 3rd удар triggers a small explosive удар.
  the_veteran:
    description:
    - '<prefix>&8• &7Стиль: как &eSoldier Boy&7.'
    - <prefix>&8• &7High &aСила&7, &9Сопротивление&7 и &6Огнестойкость&7.
