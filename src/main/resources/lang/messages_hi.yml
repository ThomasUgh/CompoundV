    - '<prefix>&8• &cहीट विज़न&7: दबाएँ &dF &8(Swap Item with Offhand)&7 टॉगल करने के लिए. डिफ़ॉल्ट: &e4.725 दिल&7, &e50 ब्लॉक&7.'
    - '<prefix>&8• &bएक्सरे&7: &dSneak + हवा में Left-Click&7 दिखाने के लिए पास की entities.'
    - '<prefix>&8• &6जंप स्टार्ट&7: &dSneak&7, ऊपर देखें और कूदें लॉन्च करने के लिए.'
    - '<prefix>&8• &7निष्क्रिय बूस्ट: &aताकत&7, &9रेज़िस्टेंस&7, &dरीजनरेशन&7, &6फायर रेज़िस्टेंस&7 और &cबोनस दिल&7.'
