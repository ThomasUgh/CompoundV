    - '<prefix>&8• &6जंप स्टार्ट&7: &dSneak&7, ऊपर देखें और कूदें. Stronger than उड़ान, slightly weaker than Patriot.'
    - '<prefix>&8• &3सोनिक बीम&7: &dSneak + Left-Click&7 फायर करने के लिए a Warden जैसा सोनिक बीम. कूलडाउन: &e3s&7.'
    - '<prefix>&8• &cएक्सप्लोसिव Melee&7: हर 2nd हिट adds a small blast; crits हिट harder.'
