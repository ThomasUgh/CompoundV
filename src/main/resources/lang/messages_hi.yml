language_file_version: 22
prefix: '&8[&b&lCV&r&8] '
general:
  no_permission: <prefix>&cआपके पास यह करने की अनुमति नहीं है।
  player_not_found: <prefix>&cखिलाड़ी नहीं मिला।
  reloaded: <prefix>&aCompoundV फिर से लोड हो गया।
  not_a_player: <prefix>&cयह कमांड केवल खिलाड़ी उपयोग कर सकते हैं।
  only_players: <prefix>&cयह कमांड केवल खिलाड़ी उपयोग कर सकते हैं।
potion:
  drinking: <prefix>&7&bसीरम&7 सक्रिय हो रहा है...
  drink_temp_v: <prefix>&aTemp V&7 सक्रिय हो रहा है। आपकी क्षमता केवल सीमित समय तक रहेगी।
  drink_v_one: <prefix>&3V One&7 सक्रिय हो रहा है। तैयार रहें।
  drink_anti_v: <prefix>&cAnti V&7 आपकी सक्रिय क्षमता हटा रहा है।
  no_ability: <prefix>&7आपके पास कोई सक्रिय क्षमता नहीं है।
  no_chances: <prefix>&cइस पोशन में कोई मान्य क्षमता कॉन्फ़िगर नहीं है। कृपया एडमिन से संपर्क करें।
  roll_failed: <prefix>&cसीरम प्रोसेस नहीं हो सका। कृपया एडमिन से संपर्क करें।
  drink_v_null: <prefix>&2V-Null Virus&7 फैल रहा है...
  temp_v_extended: <prefix>&aTemp V&7 बढ़ा दिया गया। वही क्षमता, ज्यादा अवधि।
  compound_v_after_temp: <prefix>&bCompound V&7 आपकी अस्थायी क्षमता से जुड़ गया। Temp V खत्म होने के बाद स्थायी Compound V क्षमता सक्रिय होगी।
  compound_v_delayed_granted: <prefix>&bCompound V&7 अब स्थायी रूप से सक्रिय हो गया है।
  temp_v_blocked_by_compound: <prefix>&aTemp V&7 स्थायी Compound V को ओवरराइड नहीं कर सकता। केवल हल्के साइड इफेक्ट हुए।
  no_effect_compound_active: <prefix>&7जब आपके पास पहले से स्थायी क्षमता है तो Compound V का असर नहीं होगा। पहले &cAnti V&7 उपयोग करें।
  no_effect_v_one_active: <prefix>&7आपका V One सिस्टम और V को अस्वीकार करता है। कुछ नहीं होता।
  v_one_upgrade: <prefix>&3V One&7 ने आपकी मौजूदा शक्ति अपग्रेड की।
  v_one_no_upgrade: <prefix>&7V One ने अभी इस क्षमता के साथ प्रतिक्रिया नहीं की।
  only_drinkable: <prefix>&cCompound V सीरम केवल सामान्य पीने योग्य पोशन की तरह उपयोग हो सकते हैं। V-Null Virus फेंका जा सकता है।
  milk_blocked: <prefix>&cMilk cannot remove Compound V powers. Use Anti V or V-Null mechanics instead.
