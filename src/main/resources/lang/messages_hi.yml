    - '<prefix>&8• &dSneak + Left-Click + ऊपर देखें&7: बनें &52x बड़ा&7, दोगुना डैमेज, &aJump Boost II&7 और &c+10 दिल&7 for max &e1min&7.'
    - '<prefix>&8• &dSneak + Left-Click + नीचे देखें&7: बनें &53.5x छोटा&7 for max &e2min&7.'
