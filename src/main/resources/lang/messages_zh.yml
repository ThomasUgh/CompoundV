language_file_version: 28
prefix: '&8[&b&lCV&r&8] '
general:
  no_permission: <prefix>&c你没有权限这么做。
  player_not_found: <prefix>&c找不到该玩家。
  reloaded: <prefix>&aCompoundV 已重载。
  not_a_player: <prefix>&c这条命令只能由玩家使用。
  only_players: <prefix>&c这条命令只能由玩家使用。
potion:
  drinking: <prefix>&7&b血清&7正在生效……
  drink_temp_v: <prefix>&aTemp V&7正在生效，能力只会持续有限时间。
  drink_v_one: <prefix>&3V One&7正在生效，撑住。
  drink_anti_v: <prefix>&cAnti V&7正在移除你当前的能力。
  no_ability: <prefix>&7你当前没有激活的能力。
  milk_blocked: <prefix>&c牛奶无法清除 Compound V 能力，请用 Anti V 或 V-Null 机制。
  no_chances: <prefix>&c这瓶药剂没有配置可用能力，请联系管理员。
  roll_failed: <prefix>&c血清处理失败，请联系管理员。
  drink_v_null: <prefix>&2V-Null 病毒&7正在扩散……
  temp_v_extended: <prefix>&aTemp V&7已延长，同一能力，更久时间。
  compound_v_after_temp: <prefix>&bCompound V&7已与你临时能力结合，Temp V 结束后会激活永久 Compound V 能力。
  compound_v_delayed_granted: <prefix>&bCompound V&7现已永久激活。
  temp_v_blocked_by_compound: <prefix>&aTemp V&7无法覆盖永久 Compound V，只产生轻微副作用。
  no_effect_compound_active: <prefix>&7你已有永久能力时 Compound V 无效，请先使用 &cAnti V&7。
  no_effect_v_one_active: <prefix>&7你的 V One 系统拒绝更多 V，什么都没发生。
  v_one_upgrade: <prefix>&3V One&7已强化你当前的能力。
  v_one_no_upgrade: <prefix>&7V One 暂时还不能与这个能力反应。
  only_drinkable: <prefix>&cCompound V 血清只能当普通药水喝，V-Null 病毒可投掷。
ability:
  granted_header: <prefix>&8━━━━━━━━ &a能力已解锁 &8━━━━━━━━
  granted_name: <prefix>&7你通过 &b{potion}&7 解锁了 &a&l{name}&r&7。
  controls_header: <prefix>&8────── &a操作与效果 &8──────
  granted_expires: <prefix>&8• &7持续时间：&e{minutes}分 {seconds}秒
  granted_tip: <prefix>&8• &7随时输入 &f/cv stats&7 查看当前能力与操作。
  granted_footer: <prefix>&8━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  lost_on_death: <prefix>&c你死亡后失去了能力。
  expired: <prefix>&e你的临时能力已过期。
  removed_admin: <prefix>&c管理员移除了你的能力。
  removed_anti_v: <prefix>&cAnti V 移除了你的能力。
  the_patriot:
    description:
    - <prefix>&8• &7风格：类似 &cHomelander&7。
    - <prefix>&8• &a飞行&7自动开启。
    - <prefix>&8• &c热视线&7：按 &dF &8(副手交换)&7 开关，默认 &e5 颗心&7、&e44 格&7。
    - <prefix>&8• &b透视&7：&d潜行 + 左键点空气&7 显示附近实体。
    - <prefix>&8• &6起跳冲刺&7：&d潜行&7、抬头再跳可弹射。
    - <prefix>&8• &7被动：&a力量&7、&9抗性&7、&d再生&7、&c额外生命&7。
  the_patriot_v_one:
    description:
    - <prefix>&8• &7风格：类似 &cHomelander&7。
    - <prefix>&8• &a飞行&7自动开启，V One 加成更强。
    - <prefix>&8• &c热视线&7：按 &dF &8(副手交换)&7 开关，默认 &e4.725 颗心&7、&e50 格&7。
    - <prefix>&8• &b透视&7：&d潜行 + 左键点空气&7 显示附近实体。
    - <prefix>&8• &6起跳冲刺&7：&d潜行&7、抬头再跳可弹射。
    - <prefix>&8• &7被动：&a力量&7、&9抗性&7、&d再生&7、&6防火&7、&c额外生命&7。
  sonic_boom:
    description:
    - <prefix>&8• &7风格：类似 &3Bombsight&7。
    - <prefix>&8• &a飞行&7自动开启。
    - <prefix>&8• &6起跳冲刺&7：&d潜行&7、抬头再跳，比飞行强、比 Patriot 弱一点。
    - <prefix>&8• &3音爆束&7：&d潜行 + 左键&7 发射监守者式音波，冷却 &e3 秒&7。
    - <prefix>&8• &c爆炸近战&7：每第 2 击小爆炸，暴击更重。
    - <prefix>&8• &c爆炸落地&7：高处落下时 &d潜行&7，冷却 &e60 秒&7。
    - <prefix>&8• &7被动：&a力量 IV&7、&9抗性 IV&7。
  size_changer:
    description:
    - <prefix>&8• &7被动：&a力量 I&7、&9抗性 I&7。
    - <prefix>&8• &d潜行 + 左键 + 抬头&7：变大 &52 倍&7，加成伤害降低，最长 &e1 分钟&7。
    - <prefix>&8• &d潜行 + 左键 + 低头&7：缩小约 &53.5 倍&7，最长 &e2 分钟&7。
    - <prefix>&8• &7变身中 &d潜行 + 左键 + 上/下看&7 可立刻恢复。
    - <prefix>&8• &7恢复正常后才开始冷却。
  size_changer_v_one:
    description:
    - <prefix>&8• &3V One 升级&7 SizeChanger，被动 &a力量 I&7、&9抗性 I&7。
    - <prefix>&8• &d潜行 + 左键 + 抬头&7：约 &53 倍&7 大，V One 加成伤害降低。
    - <prefix>&8• &d潜行 + 左键 + 低头&7：约 &57 倍&7 小。
    - <prefix>&8• &7需先用 &3V One&7 升级已有 SizeChanger。
  heat_vision:
    description:
    - <prefix>&8• &b热视线&7：按 &dF &8(副手交换)&7 开关光束。
    - <prefix>&8• &7阶段：&bI&7 = 1.35 心 / 30 格，&aII&7 = 2 心 / 35 格。
    - <prefix>&8• &7更多：&6III&7 = 2.25 心 / 37 格，&cIV&7 = 2.7 心 / 40 格。
    - <prefix>&8• &7可融化冰、雪块、薄雪层，并烤熟生肉掉落。
  ice_cube:
    description:
      - "<prefix>&8• &bFrost Walker&7：移动时脚下的水会结冰。"
      - "<prefix>&8• &bIce Slide&7：所有方块都像冰一样滑；在冰上获得 &eSpeed II&7。"
      - "<prefix>&8• &b冰刺&7：按 &dF &8(Swap Item with Offhand)&7 发射小型冰刺。冷却：&e3s&7。"
      - "<prefix>&8• &7冰刺造成 &bSlowness III&7 &e5s&7，并造成 &7Weakness II&7 &e10s&7。"
      - "<prefix>&8• &7近战命中造成 &bSlowness I&7 &e5s&7。"
      - "<prefix>&8• &b冰墙&7：&d潜行 + 左键&7 会在前方约 &e4 格&7 生成临时冰墙。冷却：&e60秒&7。"
      - "<prefix>&8• &7被动增益：&aStrength I&7 和 &9Resistance I&7。"
  the_diver:
    description:
    - <prefix>&8• &7风格：类似 &bThe Deep&7。
    - <prefix>&8• &b水下呼吸&7、&b海豚恩惠 VIII&7、&e水下速度&7、&3潮涌能量 II&7 常驻。
    - <prefix>&8• &b声呐&7：水下 &d潜行 + 左键点空气&7 显示附近实体。
    - <prefix>&8• &b激流冲刺&7：水中或雨天按 &dF &8(副手交换)&7，类似激流 IV 且无需三叉戟。
    - <prefix>&8• &7被动：&a力量 II&7、&9抗性 I&7。
    - <prefix>&8• &7水下时力量与抗性各 &a+1 级&7。
  jumper:
    description:
    - <prefix>&8• &a力量 I&7 常驻。
    - <prefix>&8• &a跳跃爆发&7：按 &dF &8(副手交换)&7 获得 &a跳跃提升 V&7，期间无摔伤。
    - <prefix>&8• &7默认持续 &e10 秒&7，冷却 &e15 秒&7。
  shockwave:
    description:
    - <prefix>&8• &7被动：&a力量 II&7、&9抗性 I&7。
    - <prefix>&8• &e冲击波&7：按 &dF &8(副手交换)&7 释放 10 格击退波。
    - <prefix>&8• &7伤害：玩家 &c3 心&7，生物 &c6 心&7，冷却 &e2 分钟&7。
  vision:
    description:
    - <prefix>&8• &b透视&7：&d潜行 + 左键点空气&7 显示附近实体。
    - <prefix>&8• &7默认范围 &e35 格&7。
  the_runner:
    description:
    - <prefix>&8• &7风格：类似 &eA-Train&7。
    - <prefix>&8• &e跑者速度&7：按 &dF &8(副手交换)&7 循环速度 X、XI、XII、XV 与关闭。
    - <prefix>&8• &e冲撞奔跑&7：速度 X+ 撞实体造成 &c6 心&7，每多一级速度 &c+1 心&7。
    - <prefix>&8• &7被动：&a力量 II&7、&9抗性 I&7、&c5 颗额外心&7、无近战冷却。
  teleporter:
    description:
    - <prefix>&8• &5闪现&7：按 &dF &8(副手交换)&7 传送最多 &e35 格&7。
    - <prefix>&8• &7冷却 &e2 秒&7，含 &a力量 I&7、&9抗性 I&7。
  teleporter_v_one:
    description:
    - <prefix>&8• &3V One 升级&7 传送者。
    - <prefix>&8• &5闪现&7：按 &dF &8(副手交换)&7 传送最多 &e50 格&7。
    - <prefix>&8• &7被动：&a力量 II&7、&9抗性 III&7。
  fly:
    description:
    - <prefix>&8• &a飞行&7自动开启。
    - <prefix>&8• &6轻量起跳&7：&d潜行&7、抬头再跳，弹射较弱。
    - <prefix>&8• &7含 &a力量 I&7、&9抗性 I&7。
  speedster:
    description:
    - <prefix>&8• &e超级速度&7：按 &dF &8(副手交换)&7 开关。
    - <prefix>&8• &7开启时小幅 &9抗性&7 加成。
  strength:
    description:
    - <prefix>&8• &a力量&7 在此能力下常驻。
    - <prefix>&8• &7附带小幅 &9抗性&7 加成。
  the_ghost:
    description:
    - <prefix>&8• &5幽灵模式&7：按 &dF &8(副手交换)&7 开关隐身。
    - <prefix>&8• &7开启时获得 &5隐身 II&7，怪物不会以你为目标。
    - <prefix>&8• &7幽灵模式期间会清除已有仇恨。
    - <prefix>&8• &7被动：&9抗性 II&7、&a力量 I&7、&6防火&7。
    - <prefix>&8• &7热视线对 The Ghost 无效。
  fire:
    description:
    - <prefix>&8• &c火焰光环&7 自动点燃附近敌人。
    - <prefix>&8• &6防火&7 常驻。
    - <prefix>&8• &7含 &a力量 I&7、&9抗性 I&7。
    - <prefix>&8• &7拥有此能力时无法用打火石/火焰弹右键放火。
  the_worm:
    description:
    - <prefix>&8• &7用 &e急迫 IV&7 极快挖掘，偏向泥土、草、沙砾、沙子。
    - <prefix>&8• &dF &8(副手交换)&7 开关 &b夜视&7。
    - <prefix>&8• &7被动：&a力量 I&7、&9抗性 I&7。
  flash_light:
    description:
    - <prefix>&8• &7风格：类似 &eStarlight&7，被动 &a力量 II&7、&9抗性 I&7。
    - <prefix>&8• &dF &8(副手交换)&7 使 &e15 格&7 内玩家/生物失明 &e20 秒&7，冷却 &e2 分钟&7。
    - <prefix>&8• &d潜行 + 左键&7 发射 15 格光束，&c2 心&7 伤害、轻微燃烧与击退。
  stormstrike:
    description:
    - <prefix>&8• &7风格：类似 &eStormfront&7，&3仅 V One&7，带电起跳、&e2.75 倍&7 飞行速度。
    - <prefix>&8• &dF &8(副手交换)&7 发射 35 格锯齿闪电束，最长 &e6 秒&7，&c2.55 心&7 与缓慢，用满才过热。
    - <prefix>&8• &d潜行 + 左键&7 召唤 &e4 道真闪电&7，每第 5 次近战也落雷。
    - <prefix>&8• &7潜行落地冲击：10 格内 6 道闪电，冷却 &e100 秒&7。
    - <prefix>&8• &7被动：&a力量 III&7、&9抗性 III&7、&c10 颗额外心&7。
  fire_sonic:
    description:
    - <prefix>&8• &c烈焰光环&7：每次近战造成重度燃烧。
    - <prefix>&8• &dF &8(副手交换)&7 发射细火焰束，最长 &e2 秒&7，频率接近热视线但更弱，用满才过热。
  toxic_cloud:
    description:
    - <prefix>&8• &7被动：&a力量 I&7、&9抗性 I&7，免疫中毒。
    - <prefix>&8• &dF &8(副手交换)&7 前方释放毒雾，&2中毒 IV&7，冷却 &e2 分钟&7。
    - <prefix>&8• &d潜行 + 左键&7 短程毒吐，&c1.5 心&7 与 &2中毒 IV&7，近战附带短暂中毒 I。
  the_countess:
    description:
    - <prefix>&8• &7风格：类似 &cCrimson Countess&7。
    - <prefix>&8• &dF &8(副手交换)&7 发射火球，冷却 &e5 秒&7，&c2-4 心&7。
    - <prefix>&8• &7二段跳带小火焰，近战点燃目标。
    - <prefix>&8• &7被动：&a力量 II&7、&9抗性 I&7、&6防火&7。
  the_warrior:
    description:
    - <prefix>&8• &7风格：类似 &eQueen Maeve&7。
    - <prefix>&8• &7被动：&a力量 III&7、&9抗性 II&7、&d再生 I&7、&c10 颗额外心&7。
    - <prefix>&8• &7高摔落保护、强二段跳，&e6 格+&7 高处仅潜行落地有小爆炸。
  the_headpopper:
    description:
    - <prefix>&8• &7风格：类似 &cVictoria Neuman&7。
    - <prefix>&8• &d潜行 + 左键&7 标记最多 &e30 格&7 目标，&c3 秒&7 倒计时。
    - <prefix>&8• &7伤害：&c12.5 心&7，生物/动物 &cx2.5&7，冷却 &e20 秒&7。
    - <prefix>&8• &dF &8(副手交换)&7 对附近生物造成 &c25% 当前生命&7，冷却 &e2 分钟&7。
    - <prefix>&8• &7被动：&a力量 II&7、&9抗性 II&7、&d再生 I&7，免疫热视线。
  spider_weaver:
    description:
    - <prefix>&8• &7风格：类似 &fWebweaver&7。
    - <prefix>&8• &dF &8(副手交换)&7 或 &d潜行 + 左键&7 发射蛛网弹，冷却 &e5 秒&7。
    - <prefix>&8• &7命中造成伤害、减速/定身，大蛛网簇可留 &e1 分钟&7。
    - <prefix>&8• &7可爬墙且无摔伤，被动 &a力量 I&7、&9抗性 I&7、&d再生 I&7。
  heal_angel:
    description:
    - <prefix>&8• &7风格：类似 &fPrivate Angel&7，&3仅 V One&7。
    - <prefix>&8• &7被动：&a力量 II&7、&9抗性 II&7、&d再生 II&7、&c5 颗额外心&7。
    - <prefix>&8• &d潜行 + 近战&7 治疗目标 &a10% 最大生命&7，至少 &a1 心&7，不造成伤害，冷却 &e1 秒&7。
    - <prefix>&8• &dF &8(副手交换)&7 命令目标生物/动物攻击附近（不含你）&e2 分钟&7，冷却 &e30 秒&7。
  submarine:
    description:
    - <prefix>&8• &7风格：类似 &bTorpedo&7，&3仅 V One&7。
    - <prefix>&8• &7被动：&a力量 II&7、&9抗性 II&7、水下呼吸、海豚恩惠、潮涌能量。
    - <prefix>&8• &7水中：&a力量 V&7 与再生。
    - <prefix>&8• &dF &8(副手交换)&7 双倍强度冲刺，冷却 &e1 秒&7；&d潜行 + 左键&7 开关更强声呐 &e65 格&7。
  the_detonator:
    description:
    - <prefix>&8• &7风格：类似 &cNaqib&7。
    - <prefix>&8• &d潜行 + 左键&7 开始可取消倒计时，然后以自身为中心大爆炸，冷却 &e10 秒&7。
    - <prefix>&8• &7被动：&a力量 II&7、&9抗性 I&7、&6防火&7。
    - <prefix>&8• &7近战点燃目标，每第 3 击小爆炸。
  the_veteran:
    description:
    - <prefix>&8• &7风格：类似 &eSoldier Boy&7。
    - <prefix>&8• &7高 &a力量&7、&9抗性&7、&6防火&7。
    - <prefix>&8• &d潜行 + 左键&7：蓄力 &e5 秒&7 后胸束。
    - <prefix>&8• &7光束：高伤害、烧方块、移除玩家能力。
    - <prefix>&8• &7释放时近距强爆与蘑菇云。
