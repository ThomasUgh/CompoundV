general:
  no_permission: "<prefix>&cDafür hast du keine Berechtigung."
  player_not_found: "<prefix>&cSpieler wurde nicht gefunden."
  reloaded: "<prefix>&aCompoundV wurde neu geladen."
  not_a_player: "<prefix>&cDiesen Befehl können nur Spieler verwenden."
  only_players: "<prefix>&cDiesen Befehl können nur Spieler verwenden."

potion:
  drinking: "<prefix>&7Das &bSerum&7 wird aktiviert..."
  drink_temp_v: "<prefix>&aTemp V&7 wird aktiviert. Deine Fähigkeit hält nur für begrenzte Zeit."
  drink_v_one: "<prefix>&3V One&7 wird aktiviert. Mach dich bereit."
  drink_anti_v: "<prefix>&cAnti V&7 entfernt deine aktive Fähigkeit."
  no_ability: "<prefix>&7Du hast keine aktive Fähigkeit."
  no_chances: "<prefix>&cFür diesen Trank sind keine gültigen Fähigkeiten konfiguriert. Bitte melde dich bei einem Admin."
  roll_failed: "<prefix>&cDas Serum konnte nicht verarbeitet werden. Bitte melde dich bei einem Admin."

  drink_v_null: "<prefix>&2V-Null Virus&7 breitet sich aus..."
  temp_v_extended: "<prefix>&aTemp V&7 wurde verlängert. Gleiche Fähigkeit, längere Dauer."
  compound_v_after_temp: "<prefix>&bCompound V&7 bindet sich an deine temporäre Fähigkeit. Eine permanente Compound-V-Kraft aktiviert sich nach Ablauf von Temp V."
  compound_v_delayed_granted: "<prefix>&bCompound V&7 wurde jetzt permanent aktiviert."
  temp_v_blocked_by_compound: "<prefix>&aTemp V&7 kann permanentes Compound V nicht überschreiben. Es gab nur leichte Nebenwirkungen."
  no_effect_compound_active: "<prefix>&7Compound V hat keinen Effekt, solange du bereits eine permanente Fähigkeit hast. Nutze zuerst &cAnti V&7."
  no_effect_v_one_active: "<prefix>&7Dein V-One-System stößt weiteres V ab. Es passiert nichts."
  v_one_upgrade: "<prefix>&3V One&7 hat deine aktuelle Kraft verstärkt."
  v_one_no_upgrade: "<prefix>&7V One reagiert mit dieser Fähigkeit aktuell noch nicht."

  only_drinkable: "<prefix>&cCompound-V-Seren können nur als normale trinkbare Tränke genutzt werden. V-Null Virus ist werfbar."

ability:
  granted_header: "<prefix>&8━━━━━━━━ &aFähigkeit freigeschaltet &8━━━━━━━━"
  granted_name: "<prefix>&7Du hast &a&l{name}&r&7 durch &b{potion}&7 erhalten."
  controls_header: "<prefix>&8────── &aSteuerung & Effekte &8──────"
  granted_expires: "<prefix>&8• &7Dauer: &e{minutes}m {seconds}s"
  granted_footer: "<prefix>&8━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

  lost_on_death: "<prefix>&cDu hast deine Fähigkeit beim Tod verloren."
  expired: "<prefix>&eDeine temporäre Fähigkeit ist abgelaufen."
  removed_admin: "<prefix>&cEin Admin hat deine Fähigkeit entfernt."
  removed_anti_v: "<prefix>&cAnti V hat deine Fähigkeit entfernt."

  the_patriot:
    description:
      - "<prefix>&8• &7Style: like &cHomelander&7."
      - "<prefix>&8• &aFliegen&7 ist automatisch aktiviert."
      - "<prefix>&8• &cHeat Vision&7: Drücke &dF&7 zum Umschalten. Standard: &e5 Herzen&7, &e44 Blöcke&7."
      - "<prefix>&8• &bXRay&7: &dSchleichen + Linksklick in die Luft&7, um nahe Entities zu sehen."
      - "<prefix>&8• &6Jump Start&7: &dSchleichen&7, hochschauen und springen."
      - "<prefix>&8• &7Passive Effekte: &aStärke&7, &9Resistenz&7, &dRegeneration&7 und &cExtra-Herzen&7."
  the_patriot_v_one:
    description:
      - "<prefix>&8• &7Style: like &cHomelander&7."
      - "<prefix>&8• &aFliegen&7 ist automatisch mit stärkeren V-One-Effekten aktiviert."
      - "<prefix>&8• &cHeat Vision&7: Drücke &dF&7 zum Umschalten. Standard: &e4,725 Herzen&7, &e50 Blöcke&7."
      - "<prefix>&8• &bXRay&7: &dSchleichen + Linksklick in die Luft&7, um nahe Entities zu sehen."
      - "<prefix>&8• &6Jump Start&7: &dSchleichen&7, hochschauen und springen."
      - "<prefix>&8• &7Passive Effekte: &aStärke&7, &9Resistenz&7, &dRegeneration&7, &6Feuerresistenz&7 und &cExtra-Herzen&7."
  sonic_boom:
    description:
      - "<prefix>&8• &7Style: like &3Bombsight&7."
      - "<prefix>&8• &aFliegen&7 ist automatisch aktiviert."
      - "<prefix>&8• &6Jump Start&7: &dSchleichen&7, hochschauen und springen. Stärker als Flight, etwas schwächer als Patriot."
      - "<prefix>&8• &3Sonic Beam&7: &dSneak + Linksklick&7 feuert einen Warden-ähnlichen Schallstrahl. Cooldown: &e5s&7."
      - "<prefix>&8• &cExplosive Melee&7: Jeder 2. Treffer bekommt einen kleinen Explo-Bonus; Crits stärker."
      - "<prefix>&8• &cExplo-Aufschlag&7: &dSchleichen&7 beim Landen nach hohem Fall. Cooldown: &e60s&7."
      - "<prefix>&8• &7Passive Effekte: &aStärke IV&7 und &9Resistenz IV&7."
  size_changer:
    description:
      - "<prefix>&8• &7Passive Effekte: &aStärke II&7 und &9Resistenz II&7."
      - "<prefix>&8• &dSneak + Linksklick + hochschauen&7: &52x groß&7, doppelter Schaden, &aJump Boost II&7 und &c+10 Herzen&7 für max. &e1min&7."
      - "<prefix>&8• &dSneak + Linksklick + runterschauen&7: &53,5x klein&7 für max. &e2min&7."
      - "<prefix>&8• &7Während du verwandelt bist, macht &dSneak + Linksklick + hoch/runterschauen&7 dich sofort normal."
      - "<prefix>&8• &7Cooldown startet nach Rückkehr zur normalen Größe."
  size_changer_v_one:
    description:
      - "<prefix>&8• &3V-One-Upgrade&7 für SizeChanger. Passiv: &aStärke III&7 und &9Resistenz II&7."
      - "<prefix>&8• &dSneak + Linksklick + hochschauen&7: ca. &53x groß&7, stärkerer Schaden, &aJump Boost IV&7 und &c+20 Herzen&7."
      - "<prefix>&8• &dSneak + Linksklick + runterschauen&7: ca. &57x kleiner&7."
      - "<prefix>&8• &7Nur durch Upgrade eines aktiven SizeChangers mit &3V One&7 erhältlich."
  heat_vision:
    description:
      - "<prefix>&8• &bHeat Vision&7: Drücke &dF&7 zum Umschalten des Strahls."
      - "<prefix>&8• &7Stufen: &bI&7 = 1,35 Herzen / 30 Blöcke, &aII&7 = 2 Herzen / 35 Blöcke."
      - "<prefix>&8• &7Weitere Stufen: &6III&7 = 2,25 Herzen / 37 Blöcke, &cIV&7 = 2,7 Herzen / 40 Blöcke."
      - "<prefix>&8• &7Kann Eis, Schneeblöcke und flache Schneeschichten schmelzen und rohe Mob-Drops braten."
  the_diver:
    description:
      - "<prefix>&8• &7Style: like &bThe Deep&7."
      - "<prefix>&8• &bWasseratmung&7, &bDolphin's Grace VIII&7, &eSpeed im Wasser&7 und &3Conduit Power II&7 sind dauerhaft aktiv."
      - "<prefix>&8• &bSonar&7: &dSchleichen + Linksklick in die Luft&7 unter Wasser, um nahe Entities sichtbar zu machen."
      - "<prefix>&8• &bSog-Dash&7: &dSchleichen + Rechtsklick&7 in Wasser oder Regen, ähnlich wie ein Sog-IV-Dreizack ohne Item."
      - "<prefix>&8• &7Passive Effekte: &aStärke II&7 und &9Resistenz I&7."
      - "<prefix>&8• &7Unter Wasser werden Stärke und Resistenz um &a+1 Stufe&7 erhöht."
  jumper:
    description:
      - "<prefix>&8• &aStärke I&7 ist dauerhaft aktiv."
      - "<prefix>&8• &aJump Burst&7: Drücke &dF&7 für &aJump Boost V&7 und keinen Fallschaden während aktiv."
      - "<prefix>&8• &7Standard-Aktivzeit: &e10s&7. Cooldown: &e15s&7."
  shockwave:
    description:
      - "<prefix>&8• &7Passive Effekte: &aStärke II&7 und &9Resistenz I&7."
      - "<prefix>&8• &eShockwave&7: Drücke &dF&7 für eine 10-Block-Rückstoßwelle."
      - "<prefix>&8• &7Schaden: &c3 Herzen&7 gegen Spieler, &c6 Herzen&7 gegen Mobs. Cooldown: &e2min&7."
  vision:
    description:
      - "<prefix>&8• &bRöntgenblick&7: &dSchleichen + Linksklick in die Luft&7, um nahe Entities sichtbar zu machen."
      - "<prefix>&8• &7Standard-Reichweite: &e35 Blöcke&7."
  the_runner:
    description:
      - "<prefix>&8• &7Style: like &eA-Train&7."
      - "<prefix>&8• &eRunner Speed&7: Drücke &dF&7, um Speed X, XI, XII, XV und aus durchzuschalten."
      - "<prefix>&8• &eImpact Run&7: Wenn du ab Speed X durch Entities rennst, verursachst du &c6 Herzen&7 Schaden, plus &c+1 Herz&7 pro weiterer Speed-Stufe."
      - "<prefix>&8• &7Passive Effekte: &aStärke II&7, &9Resistenz I&7, &c5 Extra-Herzen&7 und kein Nahkampf-Cooldown."
  teleporter:
    description:
      - "<prefix>&8• &5Blink&7: Drücke &dF&7, um bis zu &e35 Blöcke&7 zu teleportieren."
      - "<prefix>&8• &7Cooldown: &e2 Sekunden&7. Enthält &aStärke I&7 und &9Resistenz I&7."
  teleporter_v_one:
    description:
      - "<prefix>&8• &3V-One-Upgrade&7 für Teleporter."
      - "<prefix>&8• &5Blink&7: Drücke &dF&7, um bis zu &e50 Blöcke&7 zu teleportieren."
      - "<prefix>&8• &7Passive Effekte: &aStärke II&7 und &9Resistenz III&7."
  fly:
    description:
      - "<prefix>&8• &aFliegen&7 ist automatisch aktiviert."
      - "<prefix>&8• &6Leichter Jump Start&7: &dSchleichen&7, hochschauen und springen."
      - "<prefix>&8• &7Enthält &aStärke I&7 und &9Resistenz I&7."
  speedster:
    description:
      - "<prefix>&8• &eSuper Speed&7: Drücke &dF&7 zum Ein-/Ausschalten."
      - "<prefix>&8• &7Enthält einen kleinen &9Resistenz&7-Bonus."
  strength:
    description:
      - "<prefix>&8• &aStärke&7 ist dauerhaft aktiv, solange du diese Fähigkeit hast."
      - "<prefix>&8• &7Enthält einen kleinen &9Resistenz&7-Bonus."
  the_ghost:
    description:
      - "<prefix>&8• &5Ghost Mode&7: Drücke &dF&7 zum Ein-/Ausschalten."
      - "<prefix>&8• &7Aktiviert gibt dir &5Unsichtbarkeit II&7 und Mobs targeten dich nicht."
      - "<prefix>&8• &7Bestehende Mob-Targets werden während Ghost Mode aktiv entfernt."
      - "<prefix>&8• &7Passive Effekte: &9Resistenz II&7, &aStärke I&7 und &6Feuerresistenz&7."
      - "<prefix>&8• &7Heat Vision verursacht bei The Ghost keinen Schaden."
  fire:
    description:
      - "<prefix>&8• &cFeuer-Aura&7 entzündet Gegner in deiner Nähe automatisch."
      - "<prefix>&8• &6Feuerresistenz&7 ist aktiviert."
      - "<prefix>&8• &7Enthält &aStärke I&7 und &9Resistenz I&7."
      - "<prefix>&8• &7Normales Rechtsklick-Feuerplatzieren mit &6Feuerzeug&7 oder &6Feuerkugel&7 wird blockiert, solange du diese Fähigkeit hast."
  the_worm:
    description:
      - "<prefix>&8• &7Sehr schnelles Abbauen mit &eHaste IV&7, gedacht für Dirt, Gras, Kies und Sand."
      - "<prefix>&8• &dF&7 schaltet &bNachtsicht&7 um."
      - "<prefix>&8• &7Passive Effekte: &aStärke I&7 und &9Resistenz I&7."
  flash_light:
    description:
      - "<prefix>&8• &7Style: like &eStarlight&7. Passiv: &aStärke II&7 und &9Resistenz I&7."
      - "<prefix>&8• &dF&7 blendet Spieler, Mobs und Tiere in &e15 Blöcken&7 für &e20s&7. Cooldown: &e2min&7."
      - "<prefix>&8• &dSneak + Linksklick&7 feuert einen 15-Block-Lichtstrahl mit &c2 Herzen&7, Mini-Verbrennung und Rückstoß."
  stormstrike:
    description:
      - "<prefix>&8• &7Style: like &eStormfront&7. &3Nur V One&7 mit Elektro-Jump-Start und &e2,75x&7 Fly-Speed."
      - "<prefix>&8• &dF&7 feuert einen gezackten 35-Block-Blitzstrahl für max. &e6s&7. Schaden: &c3 Herzen&7 und Slowness. Überhitzt nur bei voller Nutzung."
      - "<prefix>&8• &dSneak + Linksklick&7 erzeugt &e2-3 Blitze&7. Jeder 5. Schlag erzeugt einen Blitzeinschlag."
      - "<prefix>&8• &7Sneak-Explo-Fall: 6 Blitze im 10-Block-Radius. Cooldown: &e100s&7."
      - "<prefix>&8• &7Passive Effekte: &aStärke III&7, &9Resistenz III&7 und &c10 Extra-Herzen&7."
  fire_sonic:
    description:
      - "<prefix>&8• &cFlammenAura&7: Jeder Schlag verursacht starke Verbrennung."
      - "<prefix>&8• &dF&7 feuert einen dünnen Feuerstrahl für max. &e2s&7. Damage-Ticks langsamer als Heat Vision und Überhitzung nur bei voller Nutzung."
  toxic_cloud:
    description:
      - "<prefix>&8• &7Passive Effekte: &aStärke I&7 und &9Resistenz I&7. Immun gegen Gift."
      - "<prefix>&8• &dF&7 erzeugt Giftgas vor dir mit &2Gift IV&7. Cooldown: &e2min&7."
      - "<prefix>&8• &dSneak + Linksklick&7 schießt kurze Giftkotze mit &c1,5 Herzen&7 und &2Gift IV&7. Schläge geben kurz Gift I."
  the_countess:
    description:
      - "<prefix>&8• &7Style: like &cCrimson Countess&7."
      - "<prefix>&8• &dF&7 wirft einen Feuerball. Cooldown: &e5s&7. Schaden: &c2-4 Herzen&7."
      - "<prefix>&8• &7Doppelsprung mit kleiner Feueranimation. Schläge verursachen Verbrennung."
      - "<prefix>&8• &7Passive Effekte: &aStärke II&7, &9Resistenz I&7 und &6Feuerresistenz&7."
  the_warrior:
    description:
      - "<prefix>&8• &7Style: like &eQueen Maeve&7."
      - "<prefix>&8• &7Passive Effekte: &aStärke III&7, &9Resistenz II&7, &dRegeneration I&7 und &c10 Extra-Herzen&7."
      - "<prefix>&8• &7Hoher Fallschutz, starker Doppelsprung und kleiner Explo-Fall ab &e6+ Blöcken&7 nur beim Sneaken."
  the_headpopper:
    description:
      - "<prefix>&8• &7Style: like &cVictoria Neuman&7."
      - "<prefix>&8• &dSneak + Linksklick&7 markiert ein Ziel bis &e30 Blöcke&7 für einen &c3s&7 Countdown."
      - "<prefix>&8• &7Schaden: &c12,5 Herzen&7, Mobs/Tiere bekommen &cx2,5&7. Cooldown: &e20s&7."
      - "<prefix>&8• &dF&7 fügt allen nahen Living-Targets &c25% aktuelles Leben&7 als Schaden zu. Cooldown: &e2min&7."
      - "<prefix>&8• &7Passive Effekte: &aStärke II&7, &9Resistenz II&7, &dRegeneration I&7 und Heat-Vision-Immunität."
  spider_weaver:
    description:
      - "<prefix>&8• &7Style: like &fWebweaver&7."
      - "<prefix>&8• &dF&7 oder &dSneak + Linksklick&7 schießt ein Spinnweben-Projektil. Cooldown: &e5s&7."
      - "<prefix>&8• &7Ziele bekommen Schaden, werden festgesetzt und größere Netze können bis &e1min&7 halten."
      - "<prefix>&8• &7Kann Wände hochklettern und bekommt keinen Fallschaden. Passiv: &aStärke I&7, &9Resistenz I&7 und &dRegeneration I&7."
  the_veteran:
    description:
      - "<prefix>&8• &7Style: like &eSoldier Boy&7."
      - "<prefix>&8• &7Hohe &aStärke&7, &9Resistenz&7 und &6Feuerresistenz&7."
      - "<prefix>&8• &dSneak + Linksklick&7: &e5s Aufladung&7, dann Bruststrahl."
      - "<prefix>&8• &7Beam: hoher Schaden, Block-Burn und Ability-Remove bei Spielern."
      - "<prefix>&8• &7Startet mit starker Nahbereichs-Explosion und Atompilz."

