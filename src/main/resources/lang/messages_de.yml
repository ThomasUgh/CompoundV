  the_patriot:
    description:
      - "<prefix>&8• &aFliegen&7 ist automatisch aktiviert."
      - "<prefix>&8• &cHeat Vision&7: Drücke &dF&7 zum Umschalten des starken roten Strahls."
      - "<prefix>&8• &bXRay&7: &dSchleichen + Rechtsklick&7, während du einen Block anschaust oder ein normales Item hältst, um nahe Entities zu sehen."
      - "<prefix>&8• &6Jump Start&7: &dSchleichen&7, hochschauen und springen."
      - "<prefix>&8• &7Passive Effekte: &aStärke&7, &9Resistenz&7, &dRegeneration&7 und &cExtra-Herzen&7."
  the_patriot_v_one:
    description:
      - "<prefix>&8• &aFliegen&7 ist automatisch mit stärkeren V-One-Effekten aktiviert."
      - "<prefix>&8• &cHeat Vision&7: Drücke &dF&7 zum Umschalten eines dichteren roten Strahls."
      - "<prefix>&8• &bXRay&7: &dSchleichen + Rechtsklick&7, während du einen Block anschaust oder ein normales Item hältst, um nahe Entities zu sehen."
      - "<prefix>&8• &6Jump Start&7: &dSchleichen&7, hochschauen und springen."
      - "<prefix>&8• &7Passive Effekte: &aStärke&7, &9Resistenz&7, &dRegeneration&7, &6Feuerresistenz&7 und &cExtra-Herzen&7."
  heat_vision:
    description:
      - "<prefix>&8• &bHeat Vision&7: Drücke &dF&7 zum Umschalten des leichteren cyan-blauen Strahls."
      - "<prefix>&8• &7Diese Version ist &eschwächer&7 als die &cThe Patriot&7 Heat Vision, kann aber weiterhin Entities verletzen und konfigurierte Blöcke beeinflussen."
  fly:
    description:
      - "<prefix>&8• &aFliegen&7 ist automatisch aktiviert."
      - "<prefix>&8• &7Nutze die normalen Minecraft-Flugsteuerungen."
  speedster:
    description:
      - "<prefix>&8• &eSuper Speed&7: Drücke &dF&7 zum Ein-/Ausschalten."
      - "<prefix>&8• &7Enthält einen kleinen &9Resistenz&7-Bonus."
  strength:
    description:
      - "<prefix>&8• &aStärke&7 ist dauerhaft aktiv, solange du diese Fähigkeit hast."
      - "<prefix>&8• &7Enthält einen kleinen &9Resistenz&7-Bonus."
  invisibility:
    description:
      - "<prefix>&8• &5Ghost Mode&7: Drücke &dF&7 zum Ein-/Ausschalten, genau wie bei Heat Vision."
      - "<prefix>&8• &7Aktiviert gibt dir &5Unsichtbarkeit II&7."
      - "<prefix>&8• &7Enthält einen &9Resistenz&7-Bonus."
  fire:
    description:
      - "<prefix>&8• &cFeuer-Aura&7 entzündet Gegner in deiner Nähe automatisch."
      - "<prefix>&8• &6Feuerresistenz&7 ist aktiviert."
      - "<prefix>&8• &7Normales Rechtsklick-Feuerplatzieren mit &6Feuerzeug&7 oder &6Feuerkugel&7 wird blockiert, solange du diese Fähigkeit hast."
  the_veteran:
    description:
      - "<prefix>&8• &7Passive Effekte: hohe &aStärke&7, &9Resistenz&7 und &6Feuerresistenz&7."
      - "<prefix>&8• &eBruststrahl&7: &dSchleichen + Rechtsklick&7, während du einen Block anschaust oder ein normales Item hältst."
      - "<prefix>&8• &7Der Angriff lädt zuerst &e5 Sekunden&7 auf und feuert danach ca. &a3-4 Sekunden&7."
      - "<prefix>&8• &7Der dicke &egelbe Feuerstrahl&7 verursacht extremen Schaden und brennt sich langsam durch Oberflächenblöcke."
      - "<prefix>&8• &7Beim Auslösen entsteht eine &c20-TNT-artige Atom-Druckwelle&7 mit kleinem Atompilz und &ckeinem Blockschaden&7 um den Spieler."

