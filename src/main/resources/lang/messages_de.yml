  lost_on_death: "<prefix>&cDu hast deine Fähigkeit beim Tod verloren."
  expired: "<prefix>&eDeine temporäre Fähigkeit ist abgelaufen."
  removed_admin: "<prefix>&cEin Admin hat deine Fähigkeit entfernt."
  removed_anti_v: "<prefix>&cAnti V hat deine Fähigkeit entfernt."

  the_patriot:
    description:
      - "<prefix>&8• &7Style: like &cHomelander&7."
      - "<prefix>&8• &aFliegen&7 ist automatisch aktiviert."
      - "<prefix>&8• &cHeat Vision&7: Drücke &dF&7 zum Umschalten. Standard: &e5 Herzen&7, &e44 Blöcke&7."
      - "<prefix>&8• &bXRay&7: &dSchleichen + Linksklick in die Luft&7, um nahe Entities zu sehen."
      - "<prefix>&8• &6Jump Start&7: &dSchleichen&7, hochschauen und springen."
      - "<prefix>&8• &7Passive Effekte: &aStärke&7, &9Resistenz&7, &dRegeneration&7 und &cExtra-Herzen&7."
  the_patriot_v_one:
    description:
      - "<prefix>&8• &7Style: like &cHomelander&7."
      - "<prefix>&8• &aFliegen&7 ist automatisch mit stärkeren V-One-Effekten aktiviert."
      - "<prefix>&8• &cHeat Vision&7: Drücke &dF&7 zum Umschalten. Standard: &e5,25 Herzen&7, &e50 Blöcke&7."
      - "<prefix>&8• &bXRay&7: &dSchleichen + Linksklick in die Luft&7, um nahe Entities zu sehen."
      - "<prefix>&8• &6Jump Start&7: &dSchleichen&7, hochschauen und springen."
      - "<prefix>&8• &7Passive Effekte: &aStärke&7, &9Resistenz&7, &dRegeneration&7, &6Feuerresistenz&7 und &cExtra-Herzen&7."
  sonic_boom:
    description:
      - "<prefix>&8• &7Style: like &3Bombsight&7."
      - "<prefix>&8• &aFliegen&7 ist automatisch aktiviert."
      - "<prefix>&8• &6Jump Start&7: &dSchleichen&7, hochschauen und springen. Stärker als Flight, etwas schwächer als Patriot."
      - "<prefix>&8• &3Sonic Beam&7: &dSneak + Linksklick&7 feuert einen Warden-ähnlichen Schallstrahl. Cooldown: &e5s&7."
      - "<prefix>&8• &cExplosive Melee&7: Jeder 2. Treffer bekommt einen kleinen Explo-Bonus; Crits stärker."
      - "<prefix>&8• &cExplo-Aufschlag&7: &dSchleichen&7 beim Landen nach hohem Fall. Cooldown: &e60s&7."
      - "<prefix>&8• &7Passive Effekte: &aStärke IV&7 und &9Resistenz IV&7."
  size_changer:
    description:
      - "<prefix>&8• &7Passive Effekte: &aStärke II&7 und &9Resistenz II&7."
      - "<prefix>&8• &dSneak + Linksklick + hochschauen&7: &52x groß&7, doppelter Schaden, &aJump Boost II&7 und &c+10 Herzen&7 für max. &e1min&7."
      - "<prefix>&8• &dSneak + Linksklick + runterschauen&7: &53,5x klein&7 für max. &e2min&7."
      - "<prefix>&8• &7Während du verwandelt bist, macht &dSneak + Linksklick + hoch/runterschauen&7 dich sofort normal."
      - "<prefix>&8• &7Cooldown startet nach Rückkehr zur normalen Größe."
  heat_vision:
    description:
      - "<prefix>&8• &bHeat Vision&7: Drücke &dF&7 zum Umschalten des Strahls."
      - "<prefix>&8• &7Stufen: &bI&7 = 1,5 Herzen / 30 Blöcke, &aII&7 = 2,5 Herzen / 35 Blöcke, &cIII&7 = 3 Herzen / 40 Blöcke."
      - "<prefix>&8• &7Kann Eis, Schneeblöcke und flache Schneeschichten schmelzen."
  the_diver:
    description:
      - "<prefix>&8• &7Style: like &bThe Deep&7."
      - "<prefix>&8• &bWasseratmung&7, &bDolphin's Grace VIII&7, &eSpeed im Wasser&7 und &3Conduit Power II&7 sind dauerhaft aktiv."
      - "<prefix>&8• &bSonar&7: &dSchleichen + Linksklick in die Luft&7 unter Wasser, um nahe Entities sichtbar zu machen."
      - "<prefix>&8• &bSog-Dash&7: &dSchleichen + Rechtsklick&7 in Wasser oder Regen, ähnlich wie ein Sog-IV-Dreizack ohne Item."
      - "<prefix>&8• &7Passive Effekte: &aStärke II&7 und &9Resistenz I&7."
      - "<prefix>&8• &7Unter Wasser werden Stärke und Resistenz um &a+1 Stufe&7 erhöht."
  jumper:
    description:
      - "<prefix>&8• &aStärke I&7 ist dauerhaft aktiv."
      - "<prefix>&8• &aJump Burst&7: Drücke &dF&7 für &aJump Boost V&7 und keinen Fallschaden während aktiv."
      - "<prefix>&8• &7Standard-Aktivzeit: &e10s&7. Cooldown: &e15s&7."
  shockwave:
    description:
      - "<prefix>&8• &7Passive Effekte: &aStärke II&7 und &9Resistenz I&7."
      - "<prefix>&8• &eShockwave&7: Drücke &dF&7 für eine 10-Block-Rückstoßwelle."
      - "<prefix>&8• &7Schaden: &c3 Herzen&7 gegen Spieler, &c6 Herzen&7 gegen Mobs. Cooldown: &e2min&7."
  vision:
    description:
      - "<prefix>&8• &bRöntgenblick&7: &dSchleichen + Linksklick in die Luft&7, um nahe Entities sichtbar zu machen."
      - "<prefix>&8• &7Standard-Reichweite: &e35 Blöcke&7."
  the_runner:
    description:
      - "<prefix>&8• &7Style: like &eA-Train&7."
      - "<prefix>&8• &eRunner Speed&7: Drücke &dF&7, um Speed X, XI, XII, XV und aus durchzuschalten."
      - "<prefix>&8• &eImpact Run&7: Wenn du ab Speed X durch Entities rennst, verursachst du &c6 Herzen&7 Schaden, plus &c+1 Herz&7 pro weiterer Speed-Stufe."
      - "<prefix>&8• &7Passive Effekte: &aStärke II&7, &9Resistenz I&7, &c5 Extra-Herzen&7 und kein Nahkampf-Cooldown."
  teleporter:
    description:
      - "<prefix>&8• &5Blink&7: Drücke &dF&7, um bis zu &e50 Blöcke&7 zu teleportieren."
      - "<prefix>&8• &7Cooldown: &e2 Sekunden&7. Enthält &9Resistenz II&7."
  fly:
    description:
      - "<prefix>&8• &aFliegen&7 ist automatisch aktiviert."
      - "<prefix>&8• &6Leichter Jump Start&7: &dSchleichen&7, hochschauen und springen."
      - "<prefix>&8• &7Nach dem Launch fliegst du ca. &e1,5x&7 so schnell."
  speedster:
    description:
      - "<prefix>&8• &eSuper Speed&7: Drücke &dF&7 zum Ein-/Ausschalten."
      - "<prefix>&8• &7Enthält einen kleinen &9Resistenz&7-Bonus."
  strength:
    description:
      - "<prefix>&8• &aStärke&7 ist dauerhaft aktiv, solange du diese Fähigkeit hast."
      - "<prefix>&8• &7Enthält einen kleinen &9Resistenz&7-Bonus."
  invisibility:
    description:
      - "<prefix>&8• &5Ghost Mode&7: Drücke &dF&7 zum Ein-/Ausschalten."
      - "<prefix>&8• &7Aktiviert gibt dir &5Unsichtbarkeit II&7 und Mobs targeten dich nicht."
      - "<prefix>&8• &7Bestehende Mob-Targets werden während Ghost Mode aktiv entfernt."
      - "<prefix>&8• &7Passive Effekte: &9Resistenz II&7, &aStärke I&7 und &6Feuerresistenz&7."
      - "<prefix>&8• &7Heat Vision verursacht bei The Ghost keinen Schaden."
  fire:
    description:
      - "<prefix>&8• &cFeuer-Aura&7 entzündet Gegner in deiner Nähe automatisch."
      - "<prefix>&8• &6Feuerresistenz&7 ist aktiviert."
      - "<prefix>&8• &7Normales Rechtsklick-Feuerplatzieren mit &6Feuerzeug&7 oder &6Feuerkugel&7 wird blockiert, solange du diese Fähigkeit hast."
  the_veteran:
    description:
      - "<prefix>&8• &7Style: like &eSoldier Boy&7."
      - "<prefix>&8• &7Hohe &aStärke&7, &9Resistenz&7 und &6Feuerresistenz&7."
      - "<prefix>&8• &dSneak + Linksklick&7: &e5s Aufladung&7, dann Bruststrahl."
      - "<prefix>&8• &7Beam: hoher Schaden, Block-Burn und Ability-Remove bei Spielern."
      - "<prefix>&8• &7Startet mit starker Nahbereichs-Explosion und Atompilz."

