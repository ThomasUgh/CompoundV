  the_patriot:
    description:
    - "<prefix>&8• &7Tyyli: kuten &cHomelander&7."
    - "<prefix>&8• &aLentäminen&7 on käytössä automaattisesti."
    - "<prefix>&8• &cHeat Vision&7: paina &dF &8(Vaihda esine kakkoskäteen)&7 vaihtaaksesi. Oletus: &e5 sydäntä&7, &e44 lohkoa&7."
    - "<prefix>&8• &bXRay&7: &dHiivi + vasen klikkaus ilmaan&7 paljastaaksesi lähellä olevat olennot."
    - "<prefix>&8• &6Jump Start&7: &dHiivi&7, katso ylös ja hyppää ponnistaaksesi."
    - "<prefix>&8• &cSpeed Dash&7: &dHiivi + työkalupalkin rullaus&7 syöksyäksesi jopa &e27.5 lohkoa&7 eteenpäin."
    - "<prefix>&8• &cForward Leap&7: &dHiivi + hyppy + liiku eteenpäin&7 saadaksesi tasaisen 10–15 lohkon syöksyn."
    - "<prefix>&8• &7Passiiviset tehosteet: &aVoima&7, &9Kestävyys&7, &dRegeneraatio&7 ja &cbonus-sydämet&7."
  the_patriot_v_one:
    description:
    - "<prefix>&8• &7Tyyli: kuten &cHomelander&7."
    - "<prefix>&8• &aLentäminen&7 on käytössä automaattisesti, vahvemmilla V One -tehosteilla."
    - "<prefix>&8• &cHeat Vision&7: paina &dF &8(Vaihda esine kakkoskäteen)&7 vaihtaaksesi. Oletus: &e4.725 sydäntä&7, &e50 lohkoa&7."
    - "<prefix>&8• &bXRay&7: &dHiivi + vasen klikkaus ilmaan&7 paljastaaksesi lähellä olevat olennot."
    - "<prefix>&8• &6Jump Start&7: &dHiivi&7, katso ylös ja hyppää ponnistaaksesi."
    - "<prefix>&8• &cSpeed Dash&7: &dHiivi + työkalupalkin rullaus&7 syöksyäksesi jopa &e30 lohkoa&7 eteenpäin."
    - "<prefix>&8• &cForward Leap&7: &dHiivi + hyppy + liiku eteenpäin&7 saadaksesi tasaisen 10–15 lohkon syöksyn."
    - "<prefix>&8• &7Passiiviset tehosteet: &aVoima&7, &9Kestävyys&7, &dRegeneraatio&7, &6Tulenkestävyys&7 ja &cbonus-sydämet&7."
  sonic_boom:
    description:
    - "<prefix>&8• &7Tyyli: kuten &3Bombsight&7."
    - "<prefix>&8• &aLentäminen&7 on käytössä automaattisesti."
    - "<prefix>&8• &6Jump Start&7: &dHiivi&7, katso ylös ja hyppää. Vahvempi kuin Flight, hieman heikompi kuin Patriot."
    - "<prefix>&8• &3Sonic Beam&7: &dHiivi + vasen klikkaus&7 ampuaksesi Warden-tyylisen äänisäteen. Jäähtyminen: &e3s&7."
    - "<prefix>&8• &cRäjähtävä lähitaistelu&7: joka toinen osuma lisää pienen räjähdyksen; kriittiset osumat tekevät enemmän."
    - "<prefix>&8• &cRäjähtävä laskeutuminen&7: &dHiivi&7 laskeutuessasi korkean pudotuksen jälkeen. Jäähtyminen: &e60s&7."
    - "<prefix>&8• &7Passiiviset tehosteet: &aVoima IV&7 ja &9Kestävyys IV&7."
  size_changer:
    description:
    - "<prefix>&8• &7Passiiviset tehosteet: &aVoima I&7 ja &9Kestävyys I&7."
    - "<prefix>&8• &dHiivi + vasen klikkaus + katso ylös&7: muutu &52x suuremmaksi&7 pienemmällä bonusvahingolla enintään &e1min&7 ajaksi."
    - "<prefix>&8• &dHiivi + vasen klikkaus + katso alas&7: muutu &53.5x pienemmäksi&7 enintään &e2min&7 ajaksi."
    - "<prefix>&8• &7Muuntuneena &dHiivi + vasen klikkaus + katso ylös/alas&7 palauttaa sinut heti normaaliksi."
    - "<prefix>&8• &7Jäähtyminen alkaa, kun palaat normaaliksi."
  size_changer_v_one:
    description:
    - "<prefix>&8• &3V One -parannus&7 SizeChangerille. Passiivinen: &aVoima I&7 ja &9Kestävyys I&7."
    - "<prefix>&8• &dHiivi + vasen klikkaus + katso ylös&7: noin &53x suuremmaksi&7 pienemmällä V One -bonusvahingolla."
    - "<prefix>&8• &dHiivi + vasen klikkaus + katso alas&7: noin &57x pienemmäksi&7."
    - "<prefix>&8• &7Saatavilla vain parantamalla aktiivinen SizeChanger &3V One&7 -seerumilla."
  heat_vision:
    description:
    - "<prefix>&8• &bHeat Vision&7: paina &dF &8(Vaihda esine kakkoskäteen)&7 vaihtaaksesi säteen."
    - "<prefix>&8• &7Tasot: &bI&7 = 1.35 sydäntä / 30 lohkoa, &aII&7 = 2 sydäntä / 35 lohkoa."
    - "<prefix>&8• &7Lisätasot: &6III&7 = 2.25 sydäntä / 37 lohkoa, &cIV&7 = 2.7 sydäntä / 40 lohkoa."
    - "<prefix>&8• &7Voi sulattaa jäätä, lumilohkoja ja matalia lumikerroksia sekä kypsentää raakoja olentodrop-esineitä."
  ice_cube:
    description:
    - "<prefix>&8• &bFrost Walker&7: vesi jäätyy allasi liikkuessasi."
    - "<prefix>&8• &bIce Slide&7: jokainen lohko tuntuu liukkaalta; jäällä saat &eNopeus II&7."
    - "<prefix>&8• &bIce Spike&7: paina &dF &8(Vaihda esine kakkoskäteen)&7 ampuaksesi pienen jääpiikin. Jäähtyminen: &e3s&7."
    - "<prefix>&8• &7Jääpiikit antavat &bHidastus III&7 &e5s&7 ajaksi ja &7Heikkous II&7 &e10s&7 ajaksi."
    - "<prefix>&8• &7Lähitaisteluosumat antavat &bHidastus I&7 &e5s&7 ajaksi."
    - "<prefix>&8• &bIce Wall&7: &dHiivi + vasen klikkaus&7 luo väliaikaisen seinän noin &e4 lohkoa&7 eteen. Jäähtyminen: &e60s&7."
    - "<prefix>&8• &7Passiiviset tehosteet: &aVoima I&7 ja &9Kestävyys I&7."
  the_diver:
    description:
    - "<prefix>&8• &7Tyyli: kuten &bThe Deep&7."
    - "<prefix>&8• &bVedenalainen hengitys&7, &bDelfiinin armo VIII&7, &eNopeus veden alla&7 ja &3Conduit Power II&7 ovat pysyvästi aktiivisia."
    - "<prefix>&8• &bSonar&7: &dHiivi + vasen klikkaus ilmaan&7 veden alla paljastaaksesi lähellä olevat olennot."
    - "<prefix>&8• &bRiptide Dash&7: paina &dF &8(Vaihda esine kakkoskäteen)&7 vedessä tai sateessa, kuten Riptide IV ilman atrainta."
    - "<prefix>&8• &7Passiiviset tehosteet: &aVoima II&7 ja &9Kestävyys I&7."
    - "<prefix>&8• &7Veden alla Voima ja Kestävyys kasvavat &a+1 tasolla&7."
  jumper:
    description:
    - "<prefix>&8• &aVoima I&7 on pysyvästi aktiivinen."
    - "<prefix>&8• &aJump Burst&7: paina &dF &8(Vaihda esine kakkoskäteen)&7 saadaksesi &aHyppytehoste V&7 ja ei putoamisvahinkoa aktiivisena."
    - "<prefix>&8• &7Oletusaktiiviaika: &e10s&7. Jäähtyminen: &e15s&7."
  shockwave:
    description:
    - "<prefix>&8• &7Passiiviset tehosteet: &aVoima II&7 ja &9Kestävyys I&7."
    - "<prefix>&8• &eShockwave&7: paina &dF &8(Vaihda esine kakkoskäteen)&7 vapauttaaksesi 10 lohkon takaisinlyöntiaallon."
    - "<prefix>&8• &7Vahinko: &c3 sydäntä&7 pelaajille, &c6 sydäntä&7 olennoille. Jäähtyminen: &e2min&7."
  vision:
    description:
    - "<prefix>&8• &bXRay&7: &dHiivi + vasen klikkaus ilmaan&7 paljastaaksesi lähellä olevat olennot."
    - "<prefix>&8• &7Oletuskantama: &e35 lohkoa&7."
  the_runner:
    description:
    - "<prefix>&8• &7Tyyli: kuten &eA-Train&7."
    - "<prefix>&8• &eRunner Speed&7: paina &dF &8(Vaihda esine kakkoskäteen)&7 vaihtaaksesi nopeuksia Speed X, XI, XII, XV ja pois."
    - "<prefix>&8• &eImpact Run&7: olentojen läpi juokseminen nopeudella X+ tekee &c6 sydäntä&7, plus &c+1 sydän&7 jokaiselta ylimääräiseltä nopeustasolta."
    - "<prefix>&8• &7Passiiviset tehosteet: &aVoima II&7, &9Kestävyys I&7, &c5 ylimääräistä sydäntä&7 ja ei lähitaistelun jäähtymistä."
    - "<prefix>&8• &cRiski&7: seinään juokseminen kovassa vauhdissa vahingoittaa sinua."
  teleporter:
    description:
    - "<prefix>&8• &5Blink&7: paina &dF &8(Vaihda esine kakkoskäteen)&7 teleporttaaksesi jopa &e35 lohkoa&7."
    - "<prefix>&8• &7Jäähtyminen: &e2 sekuntia&7. Sisältää &aVoima I&7 ja &9Kestävyys I&7."
  teleporter_v_one:
    description:
    - "<prefix>&8• &3V One -parannus&7 Teleporterille."
    - "<prefix>&8• &5Blink&7: paina &dF &8(Vaihda esine kakkoskäteen)&7 teleporttaaksesi jopa &e50 lohkoa&7."
    - "<prefix>&8• &7Passiiviset tehosteet: &aVoima II&7 ja &9Kestävyys III&7."
  fly:
    description:
    - "<prefix>&8• &aLentäminen&7 on käytössä automaattisesti."
    - "<prefix>&8• &6Light Jump Start&7: &dHiivi&7, katso ylös ja hyppää saadaksesi heikomman ponnistuksen."
    - "<prefix>&8• &7Sisältää &aVoima I&7 ja &9Kestävyys I&7."
  speedster:
    description:
    - "<prefix>&8• &eSuper Speed&7: paina &dF &8(Vaihda esine kakkoskäteen)&7 kytkeäksesi sen päälle/pois."
    - "<prefix>&8• &7Sisältää pienen &9Kestävyys&7-bonuksen aktiivisena."
  strength:
    description:
    - "<prefix>&8• &aVoima&7 on pysyvästi aktiivinen, kun sinulla on tämä kyky."
    - "<prefix>&8• &7Sisältää pienen &9Kestävyys&7-bonuksen."
  the_ghost:
    description:
    - "<prefix>&8• &5Ghost Mode&7: paina &dF &8(Vaihda esine kakkoskäteen)&7 kytkeäksesi näkymättömyyden."
    - "<prefix>&8• &7Päällä ollessa saat &5Näkymättömyys II&7 eivätkä olennot kohdista sinuun."
    - "<prefix>&8• &7Olemassa olevat olentokohteet tyhjennetään Ghost Moden ollessa aktiivinen."
    - "<prefix>&8• &7Passiiviset tehosteet: &9Kestävyys II&7, &aVoima I&7 ja &6Tulenkestävyys&7."
    - "<prefix>&8• &7Heat Vision ei tee vahinkoa The Ghostille."
  fire:
    description:
    - "<prefix>&8• &cFire Aura&7 sytyttää lähellä olevat viholliset automaattisesti."
    - "<prefix>&8• &6Tulenkestävyys&7 on käytössä."
    - "<prefix>&8• &7Sisältää &aVoima I&7 ja &9Kestävyys I&7."
    - "<prefix>&8• &7Tavanomainen tulen asettaminen &6Tulukset&7 tai &6Tulipallot&7 -esineillä oikealla klikkauksella on estetty, kun omistat tämän kyvyn."
  the_worm:
    description:
    - "<prefix>&8• &7Erittäin nopea kaivaminen &eKiire IV&7 -tehosteella, keskittyen multaan, ruohoon, soraan ja hiekkaan."
    - "<prefix>&8• &dF &8(Vaihda esine kakkoskäteen)&7 kytkee &bPimeänäön&7."
    - "<prefix>&8• &7Passiiviset tehosteet: &aVoima I&7 ja &9Kestävyys I&7."
  flash_light:
    description:
    - "<prefix>&8• &7Tyyli: kuten &eStarlight&7. Passiivinen: &aVoima II&7 ja &9Kestävyys I&7."
    - "<prefix>&8• &dF &8(Vaihda esine kakkoskäteen)&7 sokaisee pelaajat, olennot ja eläimet &e15 lohkon&7 sisällä &e20s&7 ajaksi. Jäähtyminen: &e2min&7."
    - "<prefix>&8• &dHiivi + vasen klikkaus&7 ampuu 15 lohkon valosäteen, joka tekee &c2 sydäntä&7, pienen palovamman ja takaisinlyönnin."
  stormstrike:
    description:
    - "<prefix>&8• &7Tyyli: kuten &eStormfront&7. &3Vain V One&7, sähköisellä jump startilla ja &e2.75x&7 lentonopeudella."
    - "<prefix>&8• &dF &8(Vaihda esine kakkoskäteen)&7 ampuu sahalaitaisen 35 lohkon salamasäteen enintään &e6s&7 ajaksi. Vahinko: &c2.55 sydäntä&7 ja Hidastus. Ylikuumenee vasta täyden käytön jälkeen."
    - "<prefix>&8• &dHiivi + vasen klikkaus&7 kutsuu &e4 oikeaa salamaniskua&7. Joka 5. lähitaisteluosuma kutsuu salamaniskun."
    - "<prefix>&8• &7Hiipien laskeutumisisku: 6 salamaniskua 10 lohkon säteellä. Jäähtyminen: &e100s&7."
    - "<prefix>&8• &7Passiiviset tehosteet: &aVoima III&7, &9Kestävyys III&7 ja &c10 ylimääräistä sydäntä&7."
    - "<prefix>&8• &cRiski&7: vesi sähköttää sinua ja voimien käyttö vedessä sattuu. &bJää-/vesivoimat&7 tekevät sinuun &c+75% vahinkoa&7."
  fire_sonic:
    description:
    - "<prefix>&8• &cFlame Aura&7: jokainen lähitaisteluosuma sytyttää voimakkaan palovamman."
    - "<prefix>&8• &dF &8(Vaihda esine kakkoskäteen)&7 ampuu ohuen liekkisäteen enintään &e2s&7 ajaksi. Vahinkotikit ovat lähellä Heat Visionin nopeutta mutta heikompia ja ylikuumenevat vasta täyden käytön jälkeen."
  toxic_cloud:
    description:
    - "<prefix>&8• &7Passiiviset tehosteet: &aVoima I&7 ja &9Kestävyys I&7. Immuuni myrkylle."
    - "<prefix>&8• &dF &8(Vaihda esine kakkoskäteen)&7 vapauttaa myrkkykaasua eteesi antaen &2Myrkky IV&7. Jäähtyminen: &e2min&7."
    - "<prefix>&8• &dHiivi + vasen klikkaus&7 ampuu lyhyen myrkkyoksennuksen, joka tekee &c1.5 sydäntä&7 ja &2Myrkky IV&7. Lähitaisteluosumat antavat lyhyen Myrkky I:n."
  the_countess:
    description:
    - "<prefix>&8• &7Tyyli: kuten &cCrimson Countess&7."
    - "<prefix>&8• &dF &8(Vaihda esine kakkoskäteen)&7 laukaisee tulipallon. Jäähtyminen: &e5s&7. Vahinko: &c2–4 sydäntä&7."
    - "<prefix>&8• &7Kaksoishyppy pienellä tulianimaatiolla. Lähitaisteluosumat sytyttävät palovamman."
    - "<prefix>&8• &7Passiiviset tehosteet: &aVoima II&7, &9Kestävyys I&7 ja &6Tulenkestävyys&7."
  the_warrior:
    description:
    - "<prefix>&8• &7Tyyli: kuten &eQueen Maeve&7."
    - "<prefix>&8• &7Passiiviset tehosteet: &aVoima III&7, &9Kestävyys II&7, &dRegeneraatio I&7 ja &c10 ylimääräistä sydäntä&7."
    - "<prefix>&8• &7Korkea putoamissuojaus, vahva kaksoishyppy ja pieni räjähtävä laskeutuminen &e6+ lohkosta&7 vain hiipien."
  the_headpopper:
    description:
    - "<prefix>&8• &7Tyyli: kuten &cVictoria Neuman&7."
    - "<prefix>&8• &dHiivi + vasen klikkaus&7 merkitsee kohteen jopa &e30 lohkon&7 päässä &c3s&7 laskennalle."
    - "<prefix>&8• &7Vahinko: &c12.5 sydäntä&7, olennot/eläimet saavat &cx2.5&7. Jäähtyminen: &e20s&7."
    - "<prefix>&8• &dF &8(Vaihda esine kakkoskäteen)&7 vahingoittaa kaikkia lähellä olevia eläviä kohteita &c25% nykyisestä terveydestä&7. Jäähtyminen: &e2min&7."
    - "<prefix>&8• &7Passiiviset tehosteet: &aVoima II&7, &9Kestävyys II&7, &dRegeneraatio I&7 ja immuniteetti Heat Visionille."
  bloodweaver:
    description:
    - "<prefix>&8• &7Tyyli: kuten &cMarie Moreau&7."
    - "<prefix>&8• &dF &8(Vaihda esine kakkoskäteen)&7 ampuu &cBlood Lashin&7 jopa &e25 lohkoa&7. Jäähtyminen: &e3s&7."
    - "<prefix>&8• &7Blood Lash tekee &c2–4 sydäntä&7, hidastaa kohdetta ja aiheuttaa verenvuotoa &e3s&7 ajaksi."
    - "<prefix>&8• &7Joka &ekolmas lähitaisteluosuma&7 aiheuttaa &e2s&7 verenvuotoa &c0.5 sydäntä/s&7."
    - "<prefix>&8• &dHiivi + vasen klikkaus&7 ja jatka hiipimistä &e3s&7 loihtiaksesi &cBlood Rupturen&7 &e15 lohkon&7 säteellä."
    - "<prefix>&8• &7Blood Rupture nostaa kohteet &e3 lohkoa&7, juurruttaa ne &e5s&7, tekee &c2 sydäntä/s&7 ja heittää selviytyjät taakse."
    - "<prefix>&8• &7Hinta: &c2 sydäntä&7 ja &7Heikkous &e20s&7. Passiivinen: &9Kestävyys III&7, &aVoima II&7, &dRegeneraatio II&7, &c+5 sydäntä&7."
    - "<prefix>&8• &7Saa &c50% vähemmän Heat Vision -vahinkoa&7."
    - "<prefix>&8• &cSupe-röntgen&7: &dHiivi + F&7 korostaa lähellä olevat &cV-voimaiset pelaajat&7 punaisella."
    - "<prefix>&8• &7Kaikki Bloodweaverin hyökkäykset tekevät &c+10% vahinkoa&7."
  bloodweaver_v_one:
    description:
    - "<prefix>&8• &3V One -parannus&7 Bloodweaverille."
    - "<prefix>&8• &dF &8(Vaihda esine kakkoskäteen)&7 ampuu &cBlood Lashin&7 jopa &e25 lohkoa&7 &c2.5–5 sydämen&7 vahingolla."
    - "<prefix>&8• &dHiivi + vasen klikkaus&7 ja jatka hiipimistä &e3s&7 loihtiaksesi vahvemman &cBlood Rupturen&7."
    - "<prefix>&8• &7Blood Rupture juurruttaa ja nostaa kohteet &e7s&7, tehden &c2 sydäntä/s&7 ennen kuin heittää selviytyjät taakse."
    - "<prefix>&8• &7Passiivinen: &9Kestävyys III&7, &aVoima II&7, &dRegeneraatio II&7, &c+10 sydäntä&7 ja &c50% Heat Vision -vähennys&7."
    - "<prefix>&8• &cSupe-röntgen&7: &dHiivi + F&7 korostaa lähellä olevat &cV-voimaiset pelaajat&7 punaisella."
    - "<prefix>&8• &7Kaikki Bloodweaverin hyökkäykset tekevät &c+10% vahinkoa&7."
  spider_weaver:
    description:
    - "<prefix>&8• &7Tyyli: kuten &fWebweaver&7."
    - "<prefix>&8• &dF &8(Vaihda esine kakkoskäteen)&7 tai &dHiivi + vasen klikkaus&7 ampuu seittiammuksen. Jäähtyminen: &e5s&7."
    - "<prefix>&8• &7Kohteet saavat vahinkoa, hidastuvat/kiinnittyvät, ja suuremmat seittirykelmät voivat pysyä jopa &e1min&7."
    - "<prefix>&8• &7Voi kiivetä seiniä eikä saa putoamisvahinkoa. Passiivinen: &aVoima I&7, &9Kestävyys I&7 ja &dRegeneraatio I&7."
  heal_angel:
    description:
    - "<prefix>&8• &7Tyyli: kuten &fPrivate Angel&7. &3Vain V One&7."
    - "<prefix>&8• &7Passiiviset tehosteet: &aVoima II&7, &9Kestävyys II&7, &dRegeneraatio II&7 ja &c5 ylimääräistä sydäntä&7."
    - "<prefix>&8• &dHiivi + lähitaisteluosuma&7 parantaa kohdetta &a10% maksimiterveydestä&7, vähintään &a1 sydämen&7, eikä tee vahinkoa. Jäähtyminen: &e1s&7."
    - "<prefix>&8• &dF &8(Vaihda esine kakkoskäteen)&7 käskee kohdistetun olennon/eläimen hyökkäämään lähellä olevia kohteita kohti paitsi sinua &e2min&7 ajan. Jäähtyminen: &e30s&7."
  submarine:
    description:
    - "<prefix>&8• &7Tyyli: kuten &bTorpedo&7. &3Vain V One&7."
    - "<prefix>&8• &7Passiivinen: &aVoima II&7, &9Kestävyys II&7, Vedenalainen hengitys, Delfiinin armo ja Conduit Power."
    - "<prefix>&8• &7Vedessä: &aVoima V&7 ja Regeneraatio."
    - "<prefix>&8• &dF &8(Vaihda esine kakkoskäteen)&7 käyttää kaksinkertaisen voiman syöksyn &e1s jäähtymisellä&7. &dHiivi + vasen klikkaus&7 kytkee vahvemman sonarin &e65 lohkon&7 kantamalla."
  the_detonator:
    description:
    - "<prefix>&8• &7Tyyli: kuten &cNaqib&7."
    - "<prefix>&8• &dHiivi + vasen klikkaus&7 aloittaa peruutettavan laskennan, sitten vapauttaa valtavan itsekeskeisen räjähdyksen. Jäähtyminen: &e10s&7."
    - "<prefix>&8• &7Passiivinen: &aVoima II&7, &9Kestävyys I&7 ja &6Tulenkestävyys&7."
    - "<prefix>&8• &7Lähitaisteluosumat sytyttävät kohteet. Joka 3. osuma laukaisee pienen räjähtävän osuman."
  the_veteran:
    description:
    - "<prefix>&8• &7Tyyli: kuten &eSoldier Boy&7."
    - "<prefix>&8• &7Korkea &aVoima&7, &9Kestävyys&7 ja &6Tulenkestävyys&7."
    - "<prefix>&8• &dHiivi + vasen klikkaus&7: &e5s lataus&7, sitten rintasäde."
    - "<prefix>&8• &7Säde: korkea vahinko, lohkojen polttaminen ja pelaajien kykyjen poisto."
    - "<prefix>&8• &7Alkaa voimakkaalla lähietäisyyden iskulla ja sienipilvellä."

